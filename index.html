<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>深蹲錄製器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@300;400;700&display=swap');
  :root {
    --bg:#0a0a0f; --surface:#13131a; --accent:#c8f542; --accent2:#42f5a4;
    --text:#f0f0f0; --muted:#555570; --danger:#ff4d6d; --warn:#f5a442;
    --glow:rgba(200,245,66,0.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    justify-content:space-between;padding:40px 24px 36px;
    user-select:none;-webkit-user-select:none;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(200,245,66,0.03) 1px,transparent 1px),
      linear-gradient(90deg,rgba(200,245,66,0.03) 1px,transparent 1px);
    background-size:40px 40px;
  }

.header{text-align:center;z-index:1}
.header h1{
font-family:‘Bebas Neue’,sans-serif;font-size:clamp(26px,8vw,36px);
letter-spacing:6px;color:var(–accent);text-shadow:0 0 20px var(–glow);
}
.header p{font-size:10px;letter-spacing:2px;color:var(–muted);margin-top:4px;text-transform:uppercase}

/* ── 即時儀表板 ── */
.dashboard{
display:flex;flex-direction:column;align-items:center;gap:16px;z-index:1;width:100%;
}

/* 大數字：已錄製時間 */
.timer-big{
font-family:‘Bebas Neue’,sans-serif;font-size:88px;line-height:1;
color:var(–text);letter-spacing:-2px;text-align:center;
text-shadow:0 0 30px rgba(200,245,66,.2);
}
.timer-big.rec{color:var(–danger);text-shadow:0 0 30px rgba(255,77,109,.3)}
.timer-lbl{font-size:10px;letter-spacing:3px;color:var(–muted);text-transform:uppercase;margin-top:-8px}

/* 感應器即時顯示 */
.sensor-panel{
display:flex;gap:12px;width:100%;max-width:340px;
}
.sensor-box{
flex:1;background:var(–surface);border:1px solid #222235;
border-radius:12px;padding:10px 12px;text-align:center;
transition:border-color .2s,box-shadow .2s;
}
.sensor-box.active-up   {border-color:var(–accent); box-shadow:0 0 12px rgba(200,245,66,.2)}
.sensor-box.active-down {border-color:var(–danger);  box-shadow:0 0 12px rgba(255,77,109,.2)}
.sensor-box.active-still{border-color:var(–warn);    box-shadow:0 0 12px rgba(245,164,66,.15)}
.sensor-val{
font-family:‘Bebas Neue’,sans-serif;font-size:36px;letter-spacing:1px;
color:var(–muted);transition:color .15s;
}
.sensor-box.active-up    .sensor-val{color:var(–accent)}
.sensor-box.active-down  .sensor-val{color:var(–danger)}
.sensor-box.active-still .sensor-val{color:var(–warn)}
.sensor-lbl{font-size:8px;letter-spacing:2px;color:var(–muted);text-transform:uppercase;margin-top:2px}

/* 垂直加速度 bar */
.bar-wrap{
display:flex;flex-direction:row;align-items:center;gap:8px;
}
.bar-arrows{
display:flex;flex-direction:column;justify-content:space-between;
align-items:center;height:120px;font-size:11px;
}
.bar-track{
width:16px;height:120px;background:var(–surface);border-radius:8px;
overflow:hidden;position:relative;border:1px solid #222235;
}
.bar-track::after{
content:’’;position:absolute;top:50%;left:0;
width:100%;height:1px;background:#333350;
}
.bar-fill{
position:absolute;left:0;width:100%;height:0%;border-radius:8px;
transition:height .04s,top .04s,background .1s;
}
.bar-lbl{
font-size:8px;letter-spacing:2px;color:var(–muted);
text-transform:uppercase;writing-mode:vertical-rl;
}

/* 幀數計數 */
.frame-count{
font-size:11px;letter-spacing:1px;color:var(–muted);
}

/* ── 大按鍵 ── */
.btn-main{
width:min(300px,90vw);height:90px;border-radius:24px;
border:2px solid #333350;background:var(–surface);
color:var(–muted);font-family:‘Noto Sans TC’,sans-serif;
font-size:18px;letter-spacing:4px;cursor:pointer;
transition:all .15s;-webkit-tap-highlight-color:transparent;
display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
z-index:1;
}
.btn-main.ready{
border-color:var(–accent);color:var(–accent);
box-shadow:0 0 24px rgba(200,245,66,.2);
}
.btn-main.recording{
border-color:var(–danger);color:var(–danger);
background:rgba(255,77,109,.06);
box-shadow:0 0 24px rgba(255,77,109,.3);
}
.btn-main.has-data{
border-color:var(–accent2);color:var(–accent2);
box-shadow:0 0 24px rgba(66,245,164,.2);
}
.btn-sub{font-size:9px;letter-spacing:2px;color:var(–muted);text-transform:uppercase}
.rec-dot{
width:10px;height:10px;border-radius:50%;
background:var(–danger);display:inline-block;margin-right:6px;
animation:blink .8s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── 下載 ── */
.btn-dl{
width:min(300px,90vw);padding:14px;border-radius:16px;
border:1.5px solid var(–accent2);background:rgba(66,245,164,.06);
color:var(–accent2);font-family:‘Noto Sans TC’,sans-serif;
font-size:14px;letter-spacing:3px;cursor:pointer;
transition:all .15s;-webkit-tap-highlight-color:transparent;
z-index:1;display:none;
}
.btn-dl:active{background:rgba(66,245,164,.15)}

/* ── 狀態 ── */
.status-row{
display:flex;align-items:center;gap:8px;background:var(–surface);
border:1px solid #222235;border-radius:20px;padding:7px 16px;z-index:1;
}
.sdot{width:7px;height:7px;border-radius:50%;background:var(–muted);transition:background .3s,box-shadow .3s}
.sdot.ready{background:var(–accent2);box-shadow:0 0 8px var(–accent2);animation:blink 1.6s ease-in-out infinite}
.sdot.error{background:var(–danger);box-shadow:0 0 8px var(–danger)}
.stxt{font-size:10px;letter-spacing:1.5px;color:var(–muted);text-transform:uppercase}
</style>

</head>
<body>

<div class="header">
  <h1>深蹲錄製器</h1>
  <p>Squat Recorder · Pure Sensor Log</p>
</div>

<!-- 儀表板 -->

<div class="dashboard">

  <!-- 錄製計時 -->

  <div>
    <div class="timer-big" id="timer">0.0</div>
    <div class="timer-lbl" id="timer-lbl">尚未開始錄製</div>
  </div>

  <!-- 感應器數值 + 垂直 bar -->

  <div style="display:flex;align-items:center;gap:16px">
    <!-- 數值面板 -->
    <div class="sensor-panel" style="flex-direction:column;width:160px">
      <div class="sensor-box" id="box-mag">
        <div class="sensor-val" id="val-mag">0.00</div>
        <div class="sensor-lbl">dynMag（動態大小）</div>
      </div>
      <div class="sensor-box" id="box-up">
        <div class="sensor-val" id="val-up">0.00</div>
        <div class="sensor-lbl">dynUp（上下方向）</div>
      </div>
    </div>

```
<!-- 垂直 bar -->
<div class="bar-wrap">
  <div class="bar-arrows">
    <span style="color:var(--accent)">↑</span>
    <span style="color:var(--danger)">↓</span>
  </div>
  <div class="bar-track">
    <div class="bar-fill" id="bar-fill"></div>
  </div>
  <div class="bar-lbl">dynUp</div>
</div>
```

  </div>

  <!-- 幀數 -->

  <div class="frame-count" id="frame-count">已記錄 0 幀</div>

</div>

<!-- 大按鍵 -->

<button class="btn-main" id="btn-main">
  <span id="btn-label">點擊畫面啟用感應器</span>
  <span class="btn-sub" id="btn-sub">等待感應器就緒</span>
</button>

<!-- 下載 -->

<button class="btn-dl" id="btn-dl">↓ 下載 CSV（iOS 在新分頁長按儲存）</button>

<!-- 狀態 -->

<div class="status-row">
  <div class="sdot" id="sdot"></div>
  <div class="stxt" id="stxt">請點擊畫面啟用感應器</div>
</div>

<script>
// ── 感應器 ────────────────────────────────────────────────────
const LP = 0.85;
let gravX = 0, gravY = 0, gravZ = 0;
let warmup = 0;
const WARMUP = 25;
let sensorReady = false;

// ── 錄製狀態 ──────────────────────────────────────────────────
let isRec     = false;
let logData   = [];
let recStart  = 0;
let rafId     = null;

// ── DOM ───────────────────────────────────────────────────────
const timerEl    = document.getElementById('timer');
const timerLbl   = document.getElementById('timer-lbl');
const valMag     = document.getElementById('val-mag');
const valUp      = document.getElementById('val-up');
const boxMag     = document.getElementById('box-mag');
const boxUp      = document.getElementById('box-up');
const barFill    = document.getElementById('bar-fill');
const frameCnt   = document.getElementById('frame-count');
const btnMain    = document.getElementById('btn-main');
const btnLabel   = document.getElementById('btn-label');
const btnSub     = document.getElementById('btn-sub');
const btnDl      = document.getElementById('btn-dl');
const sdot       = document.getElementById('sdot');
const stxt       = document.getElementById('stxt');

// ── 計時 RAF ──────────────────────────────────────────────────
function startTimerRAF() {
  if (rafId) cancelAnimationFrame(rafId);
  function tick() {
    if (isRec) {
      const elapsed = (performance.now() - recStart) / 1000;
      timerEl.textContent = elapsed.toFixed(1);
    }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}
function stopTimerRAF() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
}

// ── 垂直 bar ──────────────────────────────────────────────────
function updateBar(dynUp) {
  const pct = Math.min(Math.abs(dynUp) / 3.0, 1) * 46;
  if (dynUp >= 0) {
    barFill.style.top        = (50 - pct) + '%';
    barFill.style.height     = pct + '%';
    barFill.style.background = 'var(--accent)';
  } else {
    barFill.style.top        = '50%';
    barFill.style.height     = pct + '%';
    barFill.style.background = 'var(--danger)';
  }
}

// ── 感應器色彩回饋 ────────────────────────────────────────────
function updateSensorUI(dynMag, dynUp) {
  valMag.textContent = dynMag.toFixed(2);
  valUp.textContent  = (dynUp >= 0 ? '+' : '') + dynUp.toFixed(2);

  // dynMag 顏色
  boxMag.className = 'sensor-box' +
    (dynMag > 0.5 ? ' active-up' : dynMag < 0.3 ? ' active-still' : '');

  // dynUp 方向顏色
  boxUp.className = 'sensor-box' +
    (dynUp > 0.3 ? ' active-up' : dynUp < -0.3 ? ' active-down' : ' active-still');

  updateBar(dynUp);
}

// ── DeviceMotion handler ──────────────────────────────────────
function handleMotion(e) {
  const acc = e.accelerationIncludingGravity;
  if (!acc || acc.x === null) return;

  // 低通濾波分離重力
  gravX = LP * gravX + (1 - LP) * acc.x;
  gravY = LP * gravY + (1 - LP) * acc.y;
  gravZ = LP * gravZ + (1 - LP) * acc.z;

  // 暖機
  warmup++;
  if (warmup < WARMUP) {
    stxt.textContent = `校正中 ${warmup}/${WARMUP}`;
    return;
  }
  if (warmup === WARMUP) {
    sensorReady = true;
    sdot.className  = 'sdot ready';
    stxt.textContent = '感應器就緒，可以開始錄製';
    btnMain.className = 'btn-main ready';
    btnLabel.textContent = '開始錄製';
    btnSub.textContent   = '按下後開始連續深蹲';
  }

  // 動態加速度
  const dX = acc.x - gravX, dY = acc.y - gravY, dZ = acc.z - gravZ;
  const dynMag = Math.sqrt(dX*dX + dY*dY + dZ*dZ);
  const gMag   = Math.sqrt(gravX*gravX + gravY*gravY + gravZ*gravZ) || 9.8;
  const dynUp  = -(dX*gravX + dY*gravY + dZ*gravZ) / gMag;

  // 即時 UI 更新（不管有沒有在錄製都顯示）
  updateSensorUI(dynMag, dynUp);

  // 錄製
  if (isRec) {
    const now = performance.now();
    logData.push([
      ((now - recStart) / 1000).toFixed(3),
      acc.x.toFixed(4), acc.y.toFixed(4), acc.z.toFixed(4),
      gravX.toFixed(4), gravY.toFixed(4), gravZ.toFixed(4),
      dynMag.toFixed(4), dynUp.toFixed(4)
    ]);
    frameCnt.textContent = `已記錄 ${logData.length} 幀`;
  }
}

// ── 按鍵邏輯 ─────────────────────────────────────────────────
btnMain.addEventListener('click', () => {
  // iOS: 第一次點擊直接請求權限
  if (!sensorReady) {
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission()
        .then(s => {
          if (s === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            stxt.textContent = '校正中，請靜止…';
          } else {
            sdot.className   = 'sdot error';
            stxt.textContent = '未獲得感應器權限';
          }
        }).catch(() => {
          sdot.className   = 'sdot error';
          stxt.textContent = '啟動失敗';
        });
    }
    return;
  }

  if (!isRec) {
    // 開始錄製
    isRec   = true;
    logData = [];
    recStart = performance.now();

    btnMain.className     = 'btn-main recording';
    btnLabel.innerHTML    = '<span class="rec-dot"></span>錄製中';
    btnSub.textContent    = '做完後按停止';
    timerEl.classList.add('rec');
    timerLbl.textContent  = '錄製中';
    btnDl.style.display   = 'none';
    frameCnt.textContent  = '已記錄 0 幀';
    startTimerRAF();

  } else {
    // 停止錄製
    isRec = false;
    stopTimerRAF();

    const dur = ((performance.now() - recStart) / 1000).toFixed(1);
    timerEl.classList.remove('rec');
    timerLbl.textContent  = `錄製完成 · ${logData.length} 幀`;

    btnMain.className     = 'btn-main has-data';
    btnLabel.textContent  = '重新錄製';
    btnSub.textContent    = '按下清除並重新開始';

    if (logData.length > 0) {
      btnDl.style.display = '';
    }
  }
});

// ── 下載 CSV ──────────────────────────────────────────────────
btnDl.addEventListener('click', () => {
  if (logData.length === 0) return;
  const hdr  = 'time_s,accX,accY,accZ,gravX,gravY,gravZ,dynMag,dynUp\n';
  const rows = logData.map(r => r.join(',')).join('\n');
  const csv  = hdr + rows;

  // iOS Safari 無法用 blob + a.click() 下載
  // 改用 data URI 在新分頁開啟，讓使用者長按儲存
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (isIOS) {
    // 用 data URI 開新分頁
    const dataUri = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    const w = window.open(dataUri, '_blank');
    if (!w) {
      // 被 popup blocker 擋住，改用 textarea 讓使用者複製
      showCopyFallback(csv);
    }
  } else {
    // 非 iOS 正常下載
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = `squat_raw_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.csv`;
    a.click();
  }
});

// iOS fallback：顯示全文讓使用者複製
function showCopyFallback(csv) {
  const overlay = document.createElement('div');
  overlay.style.cssText = `
    position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;gap:16px;
  `;
  overlay.innerHTML = `
    <div style="color:#c8f542;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:4px">複製 CSV 資料</div>
    <div style="color:#888;font-size:11px;letter-spacing:1px;text-align:center">全選後複製，貼到記事本儲存為 .csv</div>
    <textarea readonly style="
      width:100%;height:260px;background:#13131a;color:#aaa;
      border:1px solid #333;border-radius:8px;padding:10px;
      font-size:10px;font-family:monospace;resize:none;
    ">${csv}</textarea>

```
<button onclick="this.parentElement.remove()" style="
  background:transparent;border:1.5px solid #c8f542;color:#c8f542;
  padding:12px 40px;border-radius:40px;font-size:13px;letter-spacing:3px;
  cursor:pointer;
">關閉</button>
```

`;
// 點 textarea 自動全選
overlay.querySelector(‘textarea’).addEventListener(‘focus’, function() {
this.select();
});
document.body.appendChild(overlay);
}

// ── 請求感應器 ────────────────────────────────────────────────
function startMotion() {
if (typeof DeviceMotionEvent === ‘undefined’) {
sdot.className = ‘sdot error’;
stxt.textContent = ‘不支援感應器’;
return;
}
if (typeof DeviceMotionEvent.requestPermission === ‘function’) {
DeviceMotionEvent.requestPermission()
.then(s => {
if (s === ‘granted’) {
window.addEventListener(‘devicemotion’, handleMotion);
stxt.textContent = ‘校正中，請靜止…’;
} else {
sdot.className   = ‘sdot error’;
stxt.textContent = ‘未獲得感應器權限’;
}
}).catch(() => {
sdot.className   = ‘sdot error’;
stxt.textContent = ‘啟動失敗’;
});
} else {
window.addEventListener(‘devicemotion’, handleMotion);
stxt.textContent = ‘校正中，請靜止…’;
}
}

// 自動啟動（非 iOS）或等待點擊（iOS）
(function init() {
if (typeof DeviceMotionEvent !== ‘undefined’ &&
typeof DeviceMotionEvent.requestPermission === ‘function’) {
// iOS: 等使用者點擊按鍵才能請求權限
btnMain.className    = ‘btn-main ready’;
btnLabel.textContent = ‘點擊授權感應器’;
btnSub.textContent   = ‘iOS 需要手動授權’;
stxt.textContent     = ‘請點擊上方按鍵授權’;
} else {
// 非 iOS: 直接啟動
startMotion();
}
})();
</script>

</body>
</html>
