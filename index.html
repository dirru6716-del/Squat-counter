<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>深蹲計數器</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@300;400;700&display=swap');
:root{
  --bg:#0a0a0f; --surface:#13131a; --accent:#c8f542; --accent2:#42f5a4;
  --text:#f0f0f0; --muted:#555570; --danger:#ff4d6d; --warn:#f5a442;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{
  background:var(--bg); color:var(--text); font-family:'Noto Sans TC',sans-serif;
  min-height:100dvh; display:flex; flex-direction:column; align-items:center;
  padding:28px 20px 20px; gap:16px;
  user-select:none; -webkit-user-select:none;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(200,245,66,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(200,245,66,0.03) 1px,transparent 1px);
  background-size:40px 40px;
}
h1{
  font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:6px;
  color:var(--accent); text-shadow:0 0 20px rgba(200,245,66,.3); z-index:1;
}

/* 計數大圈 */
.ring-wrap{ position:relative; width:160px; height:160px; flex-shrink:0; z-index:1; }
.ring-svg { position:absolute; inset:0; transform:rotate(-90deg); }
.ring-bg  { fill:none; stroke:var(--surface); stroke-width:6; }
.ring-prog{
  fill:none; stroke:var(--accent); stroke-width:6; stroke-linecap:round;
  stroke-dasharray:440; stroke-dashoffset:440;
  transition:stroke-dashoffset .4s cubic-bezier(.4,0,.2,1);
  filter:drop-shadow(0 0 6px var(--accent));
}
.ring-inner{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.count-num{
  font-family:'Bebas Neue',sans-serif; font-size:76px; line-height:1;
  color:var(--text); letter-spacing:-2px;
}
.count-lbl{ font-size:9px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; }
@keyframes pop{ 0%{transform:scale(1)} 40%{transform:scale(1.15)} 100%{transform:scale(1)} }
.count-num.pop{ animation:pop .25s ease; }

/* 狀態文字 */
.phase-txt{
  font-size:13px; letter-spacing:2px; color:var(--muted);
  text-transform:uppercase; z-index:1; min-height:20px;
}
.phase-txt.active{ color:var(--accent2); }
.phase-txt.counted{ color:var(--accent); }

/* 計時卡 */
.timer-row{ display:flex; gap:10px; z-index:1; }
.tcard{
  background:var(--surface); border:1px solid #222235;
  border-radius:10px; padding:8px 16px; text-align:center; min-width:100px;
  transition:border-color .2s, box-shadow .2s;
}
.tcard.active-d{ border-color:var(--danger); box-shadow:0 0 10px rgba(255,77,109,.2); }
.tcard.done-d  { border-color:var(--danger); opacity:.6; }
.tcard.done-h  { border-color:var(--warn);   opacity:.6; }
.tval{
  font-family:'Bebas Neue',sans-serif; font-size:32px; color:var(--muted);
  transition:color .2s;
}
.tcard.active-d .tval{ color:var(--danger); }
.tlbl{ font-size:8px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }

/* 大按鍵 */
.btn-main{
  width:min(300px,90vw); min-height:84px; border-radius:22px;
  border:2px solid var(--accent); background:rgba(200,245,66,.05);
  color:var(--accent); font-family:'Noto Sans TC',sans-serif;
  font-size:18px; letter-spacing:4px; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:4px; padding:12px;
  box-shadow:0 0 20px rgba(200,245,66,.15); z-index:1;
}
.btn-main.going{
  border-color:var(--danger); color:var(--danger);
  background:rgba(255,77,109,.06); box-shadow:0 0 20px rgba(255,77,109,.2);
}
.btn-main.done{
  border-color:var(--accent2); color:var(--accent2);
  background:rgba(66,245,164,.06);
}
.btn-main:active{ transform:scale(.97); }
.btn-sub{ font-size:10px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }

/* 統計 */
.stats{ display:flex; gap:8px; z-index:1; }
.stat-box{
  background:var(--surface); border:1px solid #222235;
  border-radius:10px; padding:6px 12px; text-align:center; min-width:60px;
}
.stat-val{ font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--accent); }
.stat-lbl{ font-size:7px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }

/* 底列 */
.bottom-row{ display:flex; gap:8px; z-index:1; align-items:center; flex-wrap:wrap; justify-content:center; }
.status-row{
  display:flex; align-items:center; gap:7px; background:var(--surface);
  border:1px solid #222235; border-radius:20px; padding:6px 14px;
}
.sdot{ width:7px; height:7px; border-radius:50%; background:var(--muted); transition:background .3s, box-shadow .3s; }
.sdot.ready{ background:var(--accent2); box-shadow:0 0 8px var(--accent2); animation:blink 1.6s ease-in-out infinite; }
.sdot.error{ background:var(--danger); box-shadow:0 0 8px var(--danger); }
@keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.4} }
.stxt{ font-size:10px; letter-spacing:1px; color:var(--muted); text-transform:uppercase; }

.btn-small{
  background:transparent; border:1px solid #2a2a3a; color:var(--muted);
  font-family:'Noto Sans TC',sans-serif; font-size:10px; letter-spacing:2px;
  padding:8px 16px; border-radius:40px; cursor:pointer;
  -webkit-tap-highlight-color:transparent; transition:all .2s;
}
.btn-small:active{ border-color:var(--danger); color:var(--danger); }
.btn-small.rec-on{ border-color:var(--danger); color:var(--danger); }
.btn-small.has-data{ border-color:var(--accent2); color:var(--accent2); }

.flash{
  position:fixed; inset:0; background:rgba(200,245,66,.07);
  pointer-events:none; opacity:0; transition:opacity .06s; z-index:99;
}
.flash.show{ opacity:1; }
</style>
</head>
<body>

<h1>深蹲計數器</h1>

<!-- 計數圈 -->
<div class="ring-wrap">
  <svg class="ring-svg" viewBox="0 0 160 160">
    <circle class="ring-bg"   cx="80" cy="80" r="70"/>
    <circle class="ring-prog" id="ring" cx="80" cy="80" r="70"/>
  </svg>
  <div class="ring-inner">
    <div class="count-num" id="count-num">0</div>
    <div class="count-lbl">次</div>
  </div>
</div>

<!-- 狀態 -->
<div class="phase-txt" id="phase-txt">準備好後按下方按鍵</div>

<!-- 計時卡 -->
<div class="timer-row">
  <div class="tcard" id="card-d">
    <div class="tval" id="t-desc">0.0</div>
    <div class="tlbl">蹲下時間</div>
  </div>
  <div class="tcard" id="card-h">
    <div class="tval" id="t-hold">-</div>
    <div class="tlbl">週期</div>
  </div>
</div>

<!-- 大按鍵 -->
<button class="btn-main" id="btn-main">
  <span id="btn-label">開始深蹲</span>
  <span class="btn-sub" id="btn-sub">按下授權感應器並開始</span>
</button>

<!-- 統計 -->
<div class="stats">
  <div class="stat-box"><div class="stat-val" id="best">0</div><div class="stat-lbl">最高</div></div>
  <div class="stat-box"><div class="stat-val" id="session">0</div><div class="stat-lbl">本組</div></div>
  <div class="stat-box"><div class="stat-val" id="avg-t">-</div><div class="stat-lbl">均週期s</div></div>
</div>

<!-- 底列 -->
<div class="bottom-row">
  <div class="status-row">
    <div class="sdot" id="sdot"></div>
    <div class="stxt" id="stxt">點擊按鍵啟動</div>
  </div>
  <button class="btn-small" id="btn-rec">● 錄製</button>
  <button class="btn-small has-data" id="btn-dl" style="display:none">↓ CSV</button>
  <button class="btn-small" id="btn-reset">歸零</button>
</div>

<div class="flash" id="flash"></div>

<script>
'use strict';

// ── 偵測參數（基於實測數據，120組參數驗證）────────────────────
var LP          = 0.85;   // 低通濾波
var NEG_THRESH  = -0.25;  // dynUpSmooth 蹲下觸發
var RET_THRESH  =  0.00;  // dynUpSmooth 起立確認
var MAG_MIN     =  0.25;  // magSmooth 最小值（有真實動作）
var MIN_NEG_DUR =  0.20;  // 維持負值至少 0.2s
var MIN_CYCLE   =  2.80;  // 最短週期秒數（人體速度上限）
var SMOOTH_N    = 10;     // 移動平均幀數
var COOLDOWN    = 400;    // 計數後冷卻 ms

// ── 狀態 ─────────────────────────────────────────────────────
var step     = 'init';   // init | ready | going | locked
var sensorOn = false;
var warmup   = 0;
var WARMUP   = 25;

var gravX = 0, gravY = 0, gravZ = 0;
var upBuf = [], magBuf = [];
var negStart   = null;   // 開始蹲下的時間（秒）
var lastCountT = -999;   // 上次計數時間（秒）
var descStart  = 0;      // 本次開始的 performance.now()

var rafId = null;

// ── 統計 ─────────────────────────────────────────────────────
var count    = 0;
var session  = 0;
var best     = parseInt(localStorage.getItem('squat_best') || '0');
var totalT   = 0;
var repCount = 0;

// ── 錄製 ─────────────────────────────────────────────────────
var isRec    = false;
var logData  = [];
var recStart = 0;

// ── DOM ──────────────────────────────────────────────────────
var countNumEl = document.getElementById('count-num');
var ringEl     = document.getElementById('ring');
var flashEl    = document.getElementById('flash');
var phaseTxt   = document.getElementById('phase-txt');
var cardD      = document.getElementById('card-d');
var cardH      = document.getElementById('card-h');
var tDesc      = document.getElementById('t-desc');
var tHold      = document.getElementById('t-hold');
var btnMain    = document.getElementById('btn-main');
var btnLabel   = document.getElementById('btn-label');
var btnSub     = document.getElementById('btn-sub');
var bestEl     = document.getElementById('best');
var sessionEl  = document.getElementById('session');
var avgTEl     = document.getElementById('avg-t');
var sdot       = document.getElementById('sdot');
var stxt       = document.getElementById('stxt');
var btnRec     = document.getElementById('btn-rec');
var btnDl      = document.getElementById('btn-dl');
var btnReset   = document.getElementById('btn-reset');

bestEl.textContent = best;

// ── 環形進度 ─────────────────────────────────────────────────
function updateRing(){
  ringEl.style.strokeDashoffset = 440 * (1 - (count % 10) / 10);
}

// ── Flash ────────────────────────────────────────────────────
function doFlash(){
  flashEl.classList.add('show');
  setTimeout(function(){ flashEl.classList.remove('show'); }, 100);
}

// ── 計數 ─────────────────────────────────────────────────────
function addCount(tSec){
  count++; session++;
  if(count > best){
    best = count;
    localStorage.setItem('squat_best', best);
    bestEl.textContent = best;
  }
  countNumEl.textContent = count;
  sessionEl.textContent  = session;
  repCount++;
  totalT += tSec;
  avgTEl.textContent = (totalT / repCount).toFixed(1);
  updateRing();
  doFlash();
  countNumEl.classList.remove('pop');
  void countNumEl.offsetWidth;
  countNumEl.classList.add('pop');
}

// ── Timer RAF ────────────────────────────────────────────────
function startRAF(){
  if(rafId) cancelAnimationFrame(rafId);
  function tick(){
    if(step === 'going'){
      tDesc.textContent = ((performance.now() - descStart) / 1000).toFixed(1);
    }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}
function stopRAF(){
  if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
}

// ── 感應器 handler ───────────────────────────────────────────
function handleMotion(e){
  var acc = e.accelerationIncludingGravity;
  if(!acc || acc.x === null){ stxt.textContent = '感應器無資料'; return; }

  gravX = LP * gravX + (1 - LP) * acc.x;
  gravY = LP * gravY + (1 - LP) * acc.y;
  gravZ = LP * gravZ + (1 - LP) * acc.z;

  warmup++;
  if(warmup < WARMUP){ stxt.textContent = '校正中 ' + warmup + '/' + WARMUP; return; }
  if(warmup === WARMUP){
    sensorOn = true;
    sdot.className = 'sdot ready';
    stxt.textContent = '感應器就緒';
    // 感應器 ready 後才真正進入 ready 狀態
    if(step === 'init'){
      step = 'ready';
      btnMain.className = 'btn-main';
      btnLabel.textContent = '開始深蹲';
      btnSub.textContent   = '按下開始計數';
    }
  }

  if(step !== 'going') return;

  // 基本計算
  var dX = acc.x - gravX, dY = acc.y - gravY, dZ = acc.z - gravZ;
  var dynMag = Math.sqrt(dX*dX + dY*dY + dZ*dZ);
  var gMag   = Math.sqrt(gravX*gravX + gravY*gravY + gravZ*gravZ) || 9.8;
  var dynUp  = -(dX*gravX + dY*gravY + dZ*gravZ) / gMag;

  // 移動平均
  upBuf.push(dynUp);   if(upBuf.length  > SMOOTH_N) upBuf.shift();
  magBuf.push(dynMag); if(magBuf.length > SMOOTH_N) magBuf.shift();
  var dynUpSmooth = upBuf.reduce(function(a,b){return a+b;},0) / upBuf.length;
  var magSmooth   = magBuf.reduce(function(a,b){return a+b;},0) / magBuf.length;

  var tSec = performance.now() / 1000;

  // 錄製
  if(isRec){
    logData.push([
      ((performance.now()-recStart)/1000).toFixed(3),
      acc.x.toFixed(4), acc.y.toFixed(4), acc.z.toFixed(4),
      gravX.toFixed(4), gravY.toFixed(4), gravZ.toFixed(4),
      dynMag.toFixed(4), dynUp.toFixed(4),
      dynUpSmooth.toFixed(4), magSmooth.toFixed(4)
    ]);
  }

  // ── 多參數偵測 ─────────────────────────────────────────────
  if(dynUpSmooth < NEG_THRESH && magSmooth > MAG_MIN){
    // 蹲下訊號
    if(negStart === null) negStart = tSec;

  } else if(dynUpSmooth >= RET_THRESH){
    // 回到中性 → 判斷是否完成一下
    if(negStart !== null){
      var negDur = tSec - negStart;
      if(negDur >= MIN_NEG_DUR && tSec - lastCountT >= MIN_CYCLE){
        // ✅ 計數
        var dSec = (performance.now() - descStart) / 1000;
        lastCountT = tSec;
        negStart   = null;
        upBuf      = [];
        magBuf     = [];

        addCount(dSec);

        step = 'locked';
        phaseTxt.textContent = '✓ 完成';
        phaseTxt.className   = 'phase-txt counted';
        tDesc.textContent    = dSec.toFixed(1);
        tHold.textContent    = negDur.toFixed(1);
        cardD.className = 'tcard done-d';
        cardH.className = 'tcard done-h';
        btnMain.className = 'btn-main done';
        btnLabel.textContent = '手動備用';
        btnSub.textContent   = '感應器自動計數中';

        setTimeout(function(){
          step      = 'going';
          descStart = performance.now();
          tDesc.textContent = '0.0';
          tHold.textContent = '-';
          cardD.className   = 'tcard active-d';
          cardH.className   = 'tcard';
          phaseTxt.textContent = '↓ 蹲下中';
          phaseTxt.className   = 'phase-txt active';
          btnMain.className = 'btn-main going';
          btnLabel.textContent = '手動備用';
          btnSub.textContent   = '感應器偵測不到時按此';
        }, COOLDOWN);
        return;
      }
    }
    negStart = null;
  }
  // NEG_THRESH ~ RET_THRESH 之間：保持等待
}

// ── 主按鍵 ───────────────────────────────────────────────────
btnMain.addEventListener('click', function(){

  // INIT / READY：第一次按鍵
  if(step === 'init' || step === 'ready'){
    // iOS 需要在 click 直接呼叫 requestPermission
    if(typeof DeviceMotionEvent !== 'undefined' &&
       typeof DeviceMotionEvent.requestPermission === 'function' &&
       !sensorOn){
      stxt.textContent = '請求權限中…';
      DeviceMotionEvent.requestPermission()
        .then(function(s){
          if(s === 'granted'){
            window.addEventListener('devicemotion', handleMotion);
            stxt.textContent = '校正中，請靜止…';
          } else {
            sdot.className = 'sdot error';
            stxt.textContent = '未獲得感應器權限';
          }
        })
        .catch(function(err){
          sdot.className = 'sdot error';
          stxt.textContent = '啟動失敗：' + (err.message || err);
        });
      return;
    }

    // 感應器已就緒，開始計數
    if(!sensorOn) return;  // 還在校正中，等待
    step      = 'going';
    descStart = performance.now();
    negStart  = null;
    upBuf     = []; magBuf = [];
    tDesc.textContent = '0.0';
    tHold.textContent = '-';
    cardD.className   = 'tcard active-d';
    cardH.className   = 'tcard';
    phaseTxt.textContent = '↓ 蹲下中';
    phaseTxt.className   = 'phase-txt active';
    btnMain.className    = 'btn-main going';
    btnLabel.textContent = '手動備用';
    btnSub.textContent   = '感應器偵測不到時按此';
    startRAF();
    return;
  }

  // GOING：手動備用計數
  if(step === 'going'){
    var dSec = (performance.now() - descStart) / 1000;
    var tSec = performance.now() / 1000;
    if(tSec - lastCountT < MIN_CYCLE) return;  // 冷卻中
    lastCountT = tSec;
    negStart   = null;
    upBuf      = []; magBuf = [];

    addCount(dSec);

    step = 'locked';
    phaseTxt.textContent = '✓ 手動計數';
    phaseTxt.className   = 'phase-txt counted';
    tDesc.textContent    = dSec.toFixed(1);
    cardD.className = 'tcard done-d';
    btnMain.className = 'btn-main done';

    setTimeout(function(){
      step      = 'going';
      descStart = performance.now();
      tDesc.textContent = '0.0';
      tHold.textContent = '-';
      cardD.className   = 'tcard active-d';
      cardH.className   = 'tcard';
      phaseTxt.textContent = '↓ 蹲下中';
      phaseTxt.className   = 'phase-txt active';
      btnMain.className    = 'btn-main going';
    }, COOLDOWN);
    return;
  }
});

// ── 錄製按鍵 ─────────────────────────────────────────────────
btnRec.addEventListener('click', function(){
  if(!isRec){
    isRec = true; logData = []; recStart = performance.now();
    btnRec.textContent = '■ 停止';
    btnRec.className   = 'btn-small rec-on';
    btnDl.style.display = 'none';
  } else {
    isRec = false;
    btnRec.textContent = '● 錄製';
    btnRec.className   = 'btn-small';
    if(logData.length > 0) btnDl.style.display = '';
  }
});

// ── CSV 下載（同錄製器的做法）────────────────────────────────
btnDl.addEventListener('click', function(){
  if(logData.length === 0) return;
  var hdr = 'time_s,accX,accY,accZ,gravX,gravY,gravZ,dynMag,dynUp,dynUpSmooth,magSmooth\n';
  var csv = hdr + logData.map(function(r){ return r.join(','); }).join('\n');
  var blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  var now  = new Date();
  var fname = 'squat_' +
    now.getFullYear() +
    String(now.getMonth()+1).padStart(2,'0') +
    String(now.getDate()).padStart(2,'0') + '_' +
    String(now.getHours()).padStart(2,'0') +
    String(now.getMinutes()).padStart(2,'0') +
    String(now.getSeconds()).padStart(2,'0') + '.csv';
  var url = URL.createObjectURL(blob);
  var a   = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// ── 歸零 ─────────────────────────────────────────────────────
btnReset.addEventListener('click', function(){
  stopRAF();
  count = session = repCount = warmup = 0;
  totalT = 0;
  gravX = gravY = gravZ = 0;
  upBuf = []; magBuf = [];
  negStart = null; lastCountT = -999;
  step = sensorOn ? 'ready' : 'init';
  countNumEl.textContent = '0';
  sessionEl.textContent  = '0';
  avgTEl.textContent     = '-';
  tDesc.textContent = '0.0';
  tHold.textContent = '-';
  cardD.className = 'tcard';
  cardH.className = 'tcard';
  phaseTxt.textContent = '準備好後按下方按鍵';
  phaseTxt.className   = 'phase-txt';
  btnMain.className    = 'btn-main';
  btnLabel.textContent = '開始深蹲';
  btnSub.textContent   = '按下開始計數';
  updateRing();
});

// ── 非 iOS 直接啟動 ──────────────────────────────────────────
if(typeof DeviceMotionEvent === 'undefined'){
  sdot.className = 'sdot error';
  stxt.textContent = '不支援感應器';
} else if(typeof DeviceMotionEvent.requestPermission !== 'function'){
  // 非 iOS，直接掛 listener
  window.addEventListener('devicemotion', handleMotion);
  stxt.textContent = '校正中，請靜止…';
}
// iOS 則等使用者點按鍵才請求
</script>
</body>
</html>
