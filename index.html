<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>深蹲計數器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --accent: #c8f542;
    --accent2: #42f5a4;
    --text: #f0f0f0;
    --muted: #555570;
    --danger: #ff4d6d;
    --warn: #f5a442;
    --glow: rgba(200, 245, 66, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 32px 24px 28px;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(200,245,66,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,245,66,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(200,245,66,0.10) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── Header ── */
  .header { text-align: center; z-index: 1; }
  .header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(26px, 7vw, 36px);
    letter-spacing: 6px;
    color: var(--accent);
    text-shadow: 0 0 20px var(--glow);
  }
  .header p {
    font-size: 10px; letter-spacing: 2px;
    color: var(--muted); margin-top: 3px; text-transform: uppercase;
  }

  /* ── Main area ── */
  .main {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 1;
    width: 100%;
  }

  /* ── Counter ring ── */
  .ring-wrap { position: relative; width: 180px; height: 180px; flex-shrink: 0; }
  .ring-svg  { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring-bg   { fill: none; stroke: var(--surface); stroke-width: 6; }
  .ring-progress {
    fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: 502; stroke-dashoffset: 502;
    transition: stroke-dashoffset 0.5s cubic-bezier(.4,0,.2,1);
    filter: drop-shadow(0 0 6px var(--accent));
  }
  .ring-inner {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .count-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 80px; line-height: 1;
    color: var(--text); letter-spacing: -2px;
    text-shadow: 0 0 30px rgba(200,245,66,0.3);
  }
  .count-label { font-size: 9px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }

  @keyframes pulse-count {
    0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); }
  }
  .count-display.pop { animation: pulse-count 0.3s ease; }

  /* ── Right panel: accel bar + timers ── */
  .right-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  /* ── Timers ── */
  .timers {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .timer-box {
    background: var(--surface);
    border: 1px solid #222235;
    border-radius: 10px;
    padding: 8px 14px;
    min-width: 100px;
    text-align: center;
    transition: border-color 0.2s;
  }
  .timer-box.active-down  { border-color: var(--danger); }
  .timer-box.active-hold  { border-color: var(--warn); }
  .timer-box.active-up    { border-color: var(--accent); }
  .timer-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px; letter-spacing: 1px;
    transition: color 0.2s;
  }
  .timer-box.active-down .timer-val  { color: var(--danger); text-shadow: 0 0 10px rgba(255,77,109,0.4); }
  .timer-box.active-hold .timer-val  { color: var(--warn);   text-shadow: 0 0 10px rgba(245,164,66,0.4); }
  .timer-box.active-up   .timer-val  { color: var(--accent); text-shadow: 0 0 10px var(--glow); }
  .timer-val.inactive { color: var(--muted); }
  .timer-lbl {
    font-size: 8px; letter-spacing: 2px;
    color: var(--muted); text-transform: uppercase; margin-top: 1px;
  }

  /* ── Accel bar (vertical) ── */
  .accel-bar-wrap {
    display: flex; flex-direction: row;
    align-items: center; gap: 6px;
  }
  .accel-arrows {
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    height: 100px; font-size: 10px;
  }
  .accel-track {
    width: 12px; height: 100px;
    background: var(--surface); border-radius: 6px;
    overflow: hidden; position: relative;
    border: 1px solid #222235;
  }
  .accel-track::after {
    content: ''; position: absolute;
    top: 50%; left: 0; width: 100%; height: 1px;
    background: #333350;
  }
  .accel-fill {
    position: absolute; left: 0; width: 100%; height: 0%;
    border-radius: 6px;
    transition: height 0.04s, top 0.04s, background 0.1s;
  }
  .accel-label {
    font-size: 8px; letter-spacing: 2px;
    color: var(--muted); text-transform: uppercase;
    writing-mode: vertical-rl;
  }

  /* ── Phase bar ── */
  .phase-row {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
    z-index: 1;
  }
  .phase-steps {
    display: flex; gap: 6px; align-items: center;
  }
  .phase-step {
    display: flex; flex-direction: column;
    align-items: center; gap: 3px;
  }
  .phase-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    transition: background 0.2s, box-shadow 0.2s;
  }
  .phase-dot.active-down { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  .phase-dot.active-hold { background: var(--warn);   box-shadow: 0 0 8px var(--warn); }
  .phase-dot.active-up   { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .phase-dot-lbl { font-size: 8px; letter-spacing: 1px; color: var(--muted); }
  .phase-line { width: 18px; height: 1px; background: #222235; margin-bottom: 10px; }

  .phase-text {
    font-size: 11px; letter-spacing: 2px;
    color: var(--muted); text-transform: uppercase;
  }

  /* ── Status ── */
  .status-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid #222235;
    border-radius: 20px; padding: 7px 16px;
    z-index: 1;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .status-dot.ready { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); animation: blink 1.6s ease-in-out infinite; }
  .status-dot.error { background: var(--danger);  box-shadow: 0 0 8px var(--danger); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .status-text { font-size: 11px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }

  /* ── Stats ── */
  .stats { display: flex; gap: 16px; z-index: 1; }
  .stat-box {
    background: var(--surface); border: 1px solid #222235;
    border-radius: 10px; padding: 10px 16px; text-align: center; min-width: 72px;
  }
  .stat-val {
    font-family: 'Bebas Neue', sans-serif; font-size: 26px;
    color: var(--accent); letter-spacing: 1px; text-shadow: 0 0 10px var(--glow);
  }
  .stat-lbl { font-size: 8px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

  /* ── Bottom controls ── */
  .bottom { display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 1; width: 100%; }

  /* ── Sensitivity slider ── */
  .sensitivity-wrap {
    display: flex; flex-direction: column; align-items: center;
    gap: 5px; width: 240px;
  }
  .sensitivity-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
  .sensitivity-label { font-size: 9px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .sensitivity-val {
    font-family: 'Bebas Neue', sans-serif; font-size: 17px;
    color: var(--accent); letter-spacing: 1px; min-width: 36px; text-align: right;
  }
  .sensitivity-hint { display: flex; justify-content: space-between; width: 100%; }
  .sensitivity-hint span { font-size: 8px; letter-spacing: 1px; color: var(--muted); }

  input[type=range].slider {
    -webkit-appearance: none; width: 100%; height: 4px;
    border-radius: 2px; background: var(--surface); outline: none; border: 1px solid #222235;
  }
  input[type=range].slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px var(--glow); cursor: pointer;
    transition: transform 0.1s;
  }
  input[type=range].slider:active::-webkit-slider-thumb { transform: scale(1.3); }

  /* ── Reset button ── */
  .btn-reset {
    background: transparent; border: 1.5px solid #333350;
    color: var(--muted); font-family: 'Noto Sans TC', sans-serif;
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    padding: 12px 44px; border-radius: 40px; cursor: pointer;
    transition: border-color 0.2s, color 0.2s, box-shadow 0.2s, background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-reset:active, .btn-reset:hover {
    border-color: var(--danger); color: var(--danger);
    background: rgba(255,77,109,0.06); box-shadow: 0 0 16px rgba(255,77,109,0.2);
  }

  .flash {
    position: fixed; inset: 0; background: rgba(200,245,66,0.07);
    pointer-events: none; opacity: 0; transition: opacity 0.08s; z-index: 99;
  }
  .flash.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>深蹲計數器</h1>
  <p>Squat Counter · Accelerometer</p>
</div>

<!-- 主區：計數環 + 右側面板 -->
<div class="main">
  <!-- 計數環 -->
  <div class="ring-wrap">
    <svg class="ring-svg" viewBox="0 0 180 180">
      <circle class="ring-bg" cx="90" cy="90" r="80"/>
      <circle class="ring-progress" id="ring" cx="90" cy="90" r="80"/>
    </svg>
    <div class="ring-inner">
      <div class="count-display" id="count">0</div>
      <div class="count-label">次</div>
    </div>
  </div>

  <!-- 右側：計時器 + 加速度bar -->
  <div class="right-panel">
    <!-- 碼錶 -->
    <div class="timers">
      <div class="timer-box" id="box-down">
        <div class="timer-val inactive" id="timer-down">0.0</div>
        <div class="timer-lbl">↓ 蹲下時間</div>
      </div>
      <div class="timer-box" id="box-hold">
        <div class="timer-val inactive" id="timer-hold">0.0</div>
        <div class="timer-lbl">⏸ 維持時間</div>
      </div>
    </div>

    <!-- 加速度bar -->
    <div class="accel-bar-wrap">
      <div class="accel-arrows">
        <span style="color:var(--accent)">↑</span>
        <span style="color:var(--danger)">↓</span>
      </div>
      <div class="accel-track">
        <div class="accel-fill" id="accel-fill"></div>
      </div>
      <div class="accel-label">加速度</div>
    </div>
  </div>
</div>

<!-- 階段指示 -->
<div class="phase-row">
  <div class="phase-steps">
    <div class="phase-step">
      <div class="phase-dot" id="dot-down"></div>
      <div class="phase-dot-lbl">蹲下</div>
    </div>
    <div class="phase-line"></div>
    <div class="phase-step">
      <div class="phase-dot" id="dot-hold"></div>
      <div class="phase-dot-lbl">維持</div>
    </div>
    <div class="phase-line"></div>
    <div class="phase-step">
      <div class="phase-dot" id="dot-up"></div>
      <div class="phase-dot-lbl">起立</div>
    </div>
  </div>
  <div class="phase-text" id="phase-text">等待動作</div>
</div>

<!-- 狀態列 -->
<div class="status-row">
  <div class="status-dot" id="status-dot"></div>
  <div class="status-text" id="status-text">請允許感應器存取</div>
</div>

<!-- 統計 -->
<div class="stats">
  <div class="stat-box">
    <div class="stat-val" id="best">0</div>
    <div class="stat-lbl">最高紀錄</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="session">0</div>
    <div class="stat-lbl">本次組數</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="avg-down">-</div>
    <div class="stat-lbl">平均蹲下</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="avg-hold">-</div>
    <div class="stat-lbl">平均維持</div>
  </div>
</div>

<!-- 底部控制 -->
<div class="bottom">
  <!-- 靈敏度滑桿 -->
  <div class="sensitivity-wrap">
    <div class="sensitivity-row">
      <div class="sensitivity-label">偵測靈敏度</div>
      <div class="sensitivity-val" id="sens-val">4.0</div>
    </div>
    <input type="range" class="slider" id="sens-slider"
           min="1.0" max="8.0" step="0.5" value="4.0">
    <div class="sensitivity-hint">
      <span>高靈敏（慢速）</span>
      <span>低靈敏（快速）</span>
    </div>
  </div>

  <button class="btn-reset" id="btn-reset">歸　零</button>
</div>

<div class="flash" id="flash"></div>

<script>
  // ════════════════════════════════════════════════════════
  //  狀態機：idle → descending → holding → rising → 計數
  //
  //  descending：偵測到向下動態加速度 → 啟動「蹲下計時」
  //  holding    ：動態加速度趨近靜止（在底部）→ 啟動「維持計時」
  //  rising     ：偵測到明顯向上加速度 → 停止所有計時，計數+1
  // ════════════════════════════════════════════════════════

  const LP = 0.85;
  let RISE_THRESHOLD = 4.0;   // 起立加速閾值（滑桿可調）
  const DOWN_THRESHOLD  = 2.5; // 蹲下加速閾值（固定，較低以抓到慢速）
  const STILL_THRESHOLD = 1.2; // 靜止判定
  const COOLDOWN_MS     = 900;

  let gravX = 0, gravY = 0, gravZ = 0;
  let phase  = 'idle'; // idle | descending | holding | rising
  let locked = false;
  let warmup = 0;
  const WARMUP_FRAMES = 25;

  // 計時
  let downStart  = 0;   // 蹲下開始時間
  let holdStart  = 0;   // 維持開始時間
  let timerRAF   = null; // requestAnimationFrame handle

  // 統計
  let count   = 0;
  let session = 0;
  let best    = parseInt(localStorage.getItem('squat_best') || '0');
  let totalDown = 0, totalHold = 0, repCount = 0;

  // ── DOM ────────────────────────────────────────────────
  const countEl   = document.getElementById('count');
  const ringEl    = document.getElementById('ring');
  const statusDot = document.getElementById('status-dot');
  const statusText= document.getElementById('status-text');
  const bestEl    = document.getElementById('best');
  const sessionEl = document.getElementById('session');
  const avgDownEl = document.getElementById('avg-down');
  const avgHoldEl = document.getElementById('avg-hold');
  const flashEl   = document.getElementById('flash');
  const accelFill = document.getElementById('accel-fill');
  const phaseText = document.getElementById('phase-text');
  const dotDown   = document.getElementById('dot-down');
  const dotHold   = document.getElementById('dot-hold');
  const dotUp     = document.getElementById('dot-up');
  const timerDownEl = document.getElementById('timer-down');
  const timerHoldEl = document.getElementById('timer-hold');
  const boxDown     = document.getElementById('box-down');
  const boxHold     = document.getElementById('box-hold');

  bestEl.textContent = best;

  // ── Ring ──────────────────────────────────────────────
  function updateRing() {
    // circumference for r=80: 2π×80 ≈ 502
    ringEl.style.strokeDashoffset = 502 * (1 - (count % 10) / 10);
  }

  // ── Flash ─────────────────────────────────────────────
  function flashScreen() {
    flashEl.classList.add('show');
    setTimeout(() => flashEl.classList.remove('show'), 120);
  }

  // ── Count ─────────────────────────────────────────────
  function addCount() {
    count++; session++;
    if (count > best) {
      best = count;
      localStorage.setItem('squat_best', best);
      bestEl.textContent = best;
    }
    countEl.textContent   = count;
    sessionEl.textContent = session;
    updateRing();
    flashScreen();
    countEl.classList.remove('pop');
    void countEl.offsetWidth;
    countEl.classList.add('pop');
  }

  // ── Phase UI ──────────────────────────────────────────
  function setPhaseUI(p) {
    dotDown.className = 'phase-dot' + (p === 'descending' ? ' active-down' : '');
    dotHold.className = 'phase-dot' + (p === 'holding'    ? ' active-hold' : '');
    dotUp.className   = 'phase-dot' + (p === 'rising'     ? ' active-up'   : '');

    if      (p === 'descending') phaseText.textContent = '↓ 蹲下中';
    else if (p === 'holding')    phaseText.textContent = '⏸ 底部維持';
    else if (p === 'rising')     phaseText.textContent = '↑ 起立中';
    else                         phaseText.textContent = '等待動作';
  }

  // ── Timer boxes ───────────────────────────────────────
  function setTimerActive(box, valEl, active, colorClass) {
    box.className  = 'timer-box' + (active ? ' ' + colorClass : '');
    valEl.className = 'timer-val' + (active ? '' : ' inactive');
  }

  // ── Live timer RAF loop ────────────────────────────────
  function startTimerLoop() {
    if (timerRAF) cancelAnimationFrame(timerRAF);
    function tick() {
      const now = performance.now();
      if (phase === 'descending') {
        timerDownEl.textContent = ((now - downStart) / 1000).toFixed(1);
      } else if (phase === 'holding') {
        timerHoldEl.textContent = ((now - holdStart) / 1000).toFixed(1);
      }
      timerRAF = requestAnimationFrame(tick);
    }
    timerRAF = requestAnimationFrame(tick);
  }
  function stopTimerLoop() {
    if (timerRAF) { cancelAnimationFrame(timerRAF); timerRAF = null; }
  }

  // ── Update avg stats ──────────────────────────────────
  function updateAvg(downSec, holdSec) {
    repCount++;
    totalDown += downSec;
    totalHold += holdSec;
    avgDownEl.textContent = (totalDown / repCount).toFixed(1) + 's';
    avgHoldEl.textContent = (totalHold / repCount).toFixed(1) + 's';
  }

  // ── Accel bar ─────────────────────────────────────────
  function updateAccelBar(val) {
    const pct = Math.min(Math.abs(val) / 12, 1) * 50;
    if (val >= 0) {
      accelFill.style.top        = (50 - pct) + '%';
      accelFill.style.height     = pct + '%';
      accelFill.style.background = 'var(--accent)';
    } else {
      accelFill.style.top        = '50%';
      accelFill.style.height     = pct + '%';
      accelFill.style.background = 'var(--danger)';
    }
  }

  // ── DeviceMotion ──────────────────────────────────────
  function handleMotion(e) {
    const acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return;

    gravX = LP * gravX + (1 - LP) * acc.x;
    gravY = LP * gravY + (1 - LP) * acc.y;
    gravZ = LP * gravZ + (1 - LP) * acc.z;

    warmup++;
    if (warmup <= WARMUP_FRAMES) {
      if (warmup < WARMUP_FRAMES) {
        statusText.textContent = `校正中 ${warmup}/${WARMUP_FRAMES}`;
      } else {
        statusDot.className    = 'status-dot ready';
        statusText.textContent = '偵測中 · 開始深蹲';
      }
      if (warmup < WARMUP_FRAMES) return;
    }

    const dynX = acc.x - gravX;
    const dynY = acc.y - gravY;
    const dynZ = acc.z - gravZ;

    const gMag  = Math.sqrt(gravX*gravX + gravY*gravY + gravZ*gravZ) || 9.8;
    // 正 = 向上（起立方向），負 = 向下（蹲下方向）
    const dynUp = -(dynX*gravX + dynY*gravY + dynZ*gravZ) / gMag;

    updateAccelBar(dynUp);
    if (locked) return;

    const now = performance.now();

    // ── 狀態機 ──
    if (phase === 'idle') {
      // 偵測到向下加速 → 開始蹲下計時
      if (dynUp < -DOWN_THRESHOLD) {
        phase     = 'descending';
        downStart = now;
        setPhaseUI('descending');
        setTimerActive(boxDown, timerDownEl, true, 'active-down');
        setTimerActive(boxHold, timerHoldEl, false, '');
        timerHoldEl.textContent = '0.0';
        startTimerLoop();
      }

    } else if (phase === 'descending') {
      // 動態加速度趨近靜止 → 到達底部，切換到維持計時
      if (Math.abs(dynUp) < STILL_THRESHOLD) {
        phase     = 'holding';
        holdStart = now;
        setPhaseUI('holding');
        setTimerActive(boxDown, timerDownEl, false, '');
        setTimerActive(boxHold, timerHoldEl, true,  'active-hold');
        // 固定蹲下時間顯示
        timerDownEl.textContent = ((holdStart - downStart) / 1000).toFixed(1);
      }

    } else if (phase === 'holding') {
      // 偵測到向上加速 → 起立中
      if (dynUp > RISE_THRESHOLD) {
        const holdEnd  = now;
        const downSec  = (holdStart - downStart) / 1000;
        const holdSec  = (holdEnd   - holdStart) / 1000;

        stopTimerLoop();
        timerHoldEl.textContent = holdSec.toFixed(1);
        setTimerActive(boxHold, timerHoldEl, false, '');

        phase = 'rising';
        setPhaseUI('rising');

        addCount();
        updateAvg(downSec, holdSec);
        flashScreen();

        locked = true;
        setTimeout(() => {
          locked = false;
          phase  = 'idle';
          setPhaseUI('idle');
        }, COOLDOWN_MS);
      }

    } else if (phase === 'rising') {
      // 等冷卻，locked 控制
    }
  }

  // ── 靈敏度滑桿 ───────────────────────────────────────
  const sensSlider = document.getElementById('sens-slider');
  const sensVal    = document.getElementById('sens-val');
  sensSlider.addEventListener('input', () => {
    RISE_THRESHOLD = parseFloat(sensSlider.value);
    sensVal.textContent = RISE_THRESHOLD.toFixed(1);
    phase = 'idle'; locked = false;
    stopTimerLoop();
    setPhaseUI('idle');
    setTimerActive(boxDown, timerDownEl, false, '');
    setTimerActive(boxHold, timerHoldEl, false, '');
  });

  // ── 請求感應器權限 ────────────────────────────────────
  function startMotion() {
    if (typeof DeviceMotionEvent === 'undefined') {
      statusDot.className = 'status-dot error';
      statusText.textContent = '不支援加速度計'; return;
    }
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission()
        .then(state => {
          if (state === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            statusText.textContent = '校正中，請靜止…';
          } else {
            statusDot.className    = 'status-dot error';
            statusText.textContent = '未獲得感應器權限';
          }
        })
        .catch(() => {
          statusDot.className    = 'status-dot error';
          statusText.textContent = '權限請求失敗';
        });
    } else {
      window.addEventListener('devicemotion', handleMotion);
      statusText.textContent = '校正中，請靜止…';
    }
  }

  (function init() {
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      statusText.textContent = '點擊畫面開始';
      document.addEventListener('click', function once() {
        document.removeEventListener('click', once);
        startMotion();
      }, { once: true });
    } else {
      startMotion();
    }
  })();

  // ── Reset ────────────────────────────────────────────
  document.getElementById('btn-reset').addEventListener('click', (e) => {
    e.stopPropagation();
    count = session = warmup = repCount = 0;
    totalDown = totalHold = 0;
    gravX = gravY = gravZ = 0;
    phase = 'idle'; locked = false;
    stopTimerLoop();

    countEl.textContent    = '0';
    sessionEl.textContent  = '0';
    avgDownEl.textContent  = '-';
    avgHoldEl.textContent  = '-';
    timerDownEl.textContent = '0.0';
    timerHoldEl.textContent = '0.0';
    updateRing();
    setPhaseUI('idle');
    updateAccelBar(0);
    setTimerActive(boxDown, timerDownEl, false, '');
    setTimerActive(boxHold, timerHoldEl, false, '');

    if (statusDot.classList.contains('ready')) {
      statusDot.className    = 'status-dot';
      statusText.textContent = '校正中，請靜止…';
    }
  });
</script>
</body>
</html>
