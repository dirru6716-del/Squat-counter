<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>深蹲計數器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --accent: #c8f542;
    --accent2: #42f5a4;
    --text: #f0f0f0;
    --muted: #555570;
    --danger: #ff4d6d;
    --warn: #f5a442;
    --glow: rgba(200,245,66,0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 32px 24px 32px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(200,245,66,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,245,66,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* ── Header ── */
  .header { text-align: center; z-index: 1; }
  .header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(26px, 7vw, 34px);
    letter-spacing: 6px; color: var(--accent);
    text-shadow: 0 0 20px var(--glow);
  }
  .header p { font-size: 10px; letter-spacing: 2px; color: var(--muted); margin-top: 3px; text-transform: uppercase; }

  /* ── Counter ── */
  .counter-row {
    display: flex; align-items: center; justify-content: center;
    gap: 24px; z-index: 1;
  }
  .ring-wrap { position: relative; width: 140px; height: 140px; flex-shrink: 0; }
  .ring-svg  { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring-bg   { fill: none; stroke: var(--surface); stroke-width: 5; }
  .ring-progress {
    fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round;
    stroke-dasharray: 408; stroke-dashoffset: 408;
    transition: stroke-dashoffset 0.5s cubic-bezier(.4,0,.2,1);
    filter: drop-shadow(0 0 5px var(--accent));
  }
  .ring-inner {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .count-display {
    font-family: 'Bebas Neue', sans-serif; font-size: 68px; line-height: 1;
    color: var(--text); letter-spacing: -2px;
    text-shadow: 0 0 24px rgba(200,245,66,0.3);
  }
  .count-label { font-size: 9px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }

  @keyframes pulse-count {
    0%{transform:scale(1)} 40%{transform:scale(1.15)} 100%{transform:scale(1)}
  }
  .count-display.pop { animation: pulse-count 0.3s ease; }

  /* ── Timer cards ── */
  .timer-cards {
    display: flex; flex-direction: column; gap: 8px;
  }
  .timer-card {
    background: var(--surface); border: 1px solid #222235;
    border-radius: 10px; padding: 10px 16px;
    min-width: 110px; text-align: center;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .timer-card.phase-down { border-color: var(--danger); box-shadow: 0 0 12px rgba(255,77,109,0.2); }
  .timer-card.phase-hold { border-color: var(--warn);   box-shadow: 0 0 12px rgba(245,164,66,0.2); }
  .timer-val {
    font-family: 'Bebas Neue', sans-serif; font-size: 34px;
    letter-spacing: 1px; color: var(--muted);
    transition: color 0.25s;
  }
  .timer-card.phase-down .timer-val { color: var(--danger); }
  .timer-card.phase-hold .timer-val { color: var(--warn); }
  .timer-card.done-down  .timer-val { color: var(--danger); opacity: 0.7; }
  .timer-card.done-hold  .timer-val { color: var(--warn);   opacity: 0.7; }
  .timer-lbl { font-size: 8px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }

  /* ── Phase indicator ── */
  .phase-row {
    display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 1;
  }
  .phase-steps { display: flex; gap: 6px; align-items: center; }
  .phase-step  { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .phase-dot   { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background 0.2s, box-shadow 0.2s; }
  .phase-dot.d { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  .phase-dot.h { background: var(--warn);   box-shadow: 0 0 8px var(--warn); }
  .phase-dot.u { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .phase-lbl   { font-size: 8px; letter-spacing: 1px; color: var(--muted); }
  .phase-line  { width: 20px; height: 1px; background: #222235; margin-bottom: 11px; }
  .phase-text  { font-size: 12px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

  /* ── BIG BUTTON ── */
  .btn-wrap { z-index: 1; width: 100%; display: flex; justify-content: center; }
  .btn-main {
    width: min(280px, 90vw);
    height: 90px;
    border-radius: 24px;
    border: 2px solid #333350;
    background: var(--surface);
    color: var(--muted);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 16px; letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    position: relative; overflow: hidden;
  }
  .btn-main::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, transparent 70%);
    opacity: 0; transition: opacity 0.1s;
  }
  .btn-main:active::after { opacity: 1; }

  .btn-main.state-idle {
    border-color: var(--accent); color: var(--accent);
    box-shadow: 0 0 20px rgba(200,245,66,0.15);
  }
  .btn-main.state-down {
    border-color: var(--danger); color: var(--danger);
    box-shadow: 0 0 20px rgba(255,77,109,0.2);
    background: rgba(255,77,109,0.05);
  }
  .btn-main.state-hold {
    border-color: var(--warn); color: var(--warn);
    box-shadow: 0 0 20px rgba(245,164,66,0.2);
    background: rgba(245,164,66,0.05);
  }
  .btn-hint { font-size: 9px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }

  /* ── Stats ── */
  .stats { display: flex; gap: 10px; z-index: 1; }
  .stat-box {
    background: var(--surface); border: 1px solid #222235;
    border-radius: 10px; padding: 8px 12px; text-align: center; min-width: 64px;
  }
  .stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--accent); letter-spacing: 1px; }
  .stat-lbl { font-size: 7px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-top: 1px; }

  /* ── Status ── */
  .status-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid #222235;
    border-radius: 20px; padding: 6px 14px; z-index: 1;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background 0.3s, box-shadow 0.3s; }
  .status-dot.ready { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); animation: blink 1.6s ease-in-out infinite; }
  .status-dot.error { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .status-text { font-size: 10px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }

  /* ── Reset ── */
  .btn-reset {
    z-index: 1; background: transparent; border: 1px solid #2a2a3a;
    color: var(--muted); font-family: 'Noto Sans TC', sans-serif;
    font-size: 11px; letter-spacing: 3px; padding: 10px 36px;
    border-radius: 40px; cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-reset:active { border-color: var(--danger); color: var(--danger); background: rgba(255,77,109,0.06); }

  .flash {
    position: fixed; inset: 0; background: rgba(200,245,66,0.07);
    pointer-events: none; opacity: 0; transition: opacity 0.08s; z-index: 99;
  }
  .flash.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>深蹲計數器</h1>
  <p>Squat Counter · Tap to Count</p>
</div>

<!-- 計數 + 計時 -->
<div class="counter-row">
  <div class="ring-wrap">
    <svg class="ring-svg" viewBox="0 0 140 140">
      <circle class="ring-bg" cx="70" cy="70" r="65"/>
      <circle class="ring-progress" id="ring" cx="70" cy="70" r="65"/>
    </svg>
    <div class="ring-inner">
      <div class="count-display" id="count">0</div>
      <div class="count-label">次</div>
    </div>
  </div>

  <div class="timer-cards">
    <div class="timer-card" id="card-down">
      <div class="timer-val" id="timer-down">0.0</div>
      <div class="timer-lbl">↓ 蹲下時間</div>
    </div>
    <div class="timer-card" id="card-hold">
      <div class="timer-val" id="timer-hold">0.0</div>
      <div class="timer-lbl">⏸ 維持時間</div>
    </div>
  </div>
</div>

<!-- 階段指示 -->
<div class="phase-row">
  <div class="phase-steps">
    <div class="phase-step">
      <div class="phase-dot" id="dot-d"></div>
      <div class="phase-lbl">蹲下</div>
    </div>
    <div class="phase-line"></div>
    <div class="phase-step">
      <div class="phase-dot" id="dot-h"></div>
      <div class="phase-lbl">維持</div>
    </div>
    <div class="phase-line"></div>
    <div class="phase-step">
      <div class="phase-dot" id="dot-u"></div>
      <div class="phase-lbl">起立</div>
    </div>
  </div>
  <div class="phase-text" id="phase-text">準備好後按下方按鍵</div>
</div>

<!-- 最短蹲下時間滑桿 -->
<div style="z-index:1; width:min(280px,90vw); display:flex; flex-direction:column; gap:5px;">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <span style="font-size:9px; letter-spacing:2px; color:var(--muted); text-transform:uppercase;">最短蹲下時間</span>
    <span style="font-family:'Bebas Neue',sans-serif; font-size:17px; color:var(--warn); letter-spacing:1px;" id="min-down-val">1.5s</span>
  </div>
  <input type="range" class="slider" id="min-down-slider" min="0.5" max="4.0" step="0.5" value="1.5">
  <div style="display:flex; justify-content:space-between;">
    <span style="font-size:8px; letter-spacing:1px; color:var(--muted);">0.5s（快速深蹲）</span>
    <span style="font-size:8px; letter-spacing:1px; color:var(--muted);">4.0s（超慢速）</span>
  </div>
</div>

<!-- 大按鍵 -->
<div class="btn-wrap">
  <button class="btn-main state-idle" id="btn-main">
    <span id="btn-label">開始蹲下</span>
    <span class="btn-hint" id="btn-hint">按下開始計時</span>
  </button>
</div>

<!-- 統計 -->
<div class="stats">
  <div class="stat-box">
    <div class="stat-val" id="best">0</div>
    <div class="stat-lbl">最高紀錄</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="session">0</div>
    <div class="stat-lbl">本次組數</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="avg-down">-</div>
    <div class="stat-lbl">均蹲下(s)</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="avg-hold">-</div>
    <div class="stat-lbl">均維持(s)</div>
  </div>
</div>

<!-- 狀態 + 歸零 -->
<div class="status-row">
  <div class="status-dot ready" id="status-dot"></div>
  <div class="status-text" id="status-text">點擊畫面啟用感應器</div>
</div>

<button class="btn-reset" id="btn-reset">歸　零</button>

<div class="flash" id="flash"></div>

<script>
  // ════════════════════════════════════════════════════
  //  狀態機（按鍵驅動 + 感應器輔助）
  //
  //  phase: idle → descending → holding → idle
  //
  //  按第一下：開始「蹲下計時」(descending)
  //  感應器偵測到靜止：自動切換「維持計時」(holding)
  //  按第二下：停止計時，計數+1，回到 idle
  // ════════════════════════════════════════════════════

  // 感應器參數
  const LP              = 0.85;
  const STILL_THRESHOLD = 1.2;  // m/s² 靜止判定（切換到維持）
  const RISE_THRESHOLD  = 3.0;  // m/s² 往上加速度（自動完成）
  let   MIN_DOWN_MS     = 1500; // 至少蹲下幾 ms 後才允許切換維持

  let gravX = 0, gravY = 0, gravZ = 0;
  let sensorReady = false;
  let warmup = 0;
  const WARMUP_FRAMES = 20;

  // 計時狀態
  let phase     = 'idle'; // idle | descending | holding
  let downStart = 0;
  let holdStart = 0;
  let rafId     = null;

  // 統計
  let count    = 0;
  let session  = 0;
  let best     = parseInt(localStorage.getItem('squat_best') || '0');
  let repCount = 0, totalDown = 0, totalHold = 0;

  // DOM
  const countEl    = document.getElementById('count');
  const ringEl     = document.getElementById('ring');
  const flashEl    = document.getElementById('flash');
  const statusDot  = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const bestEl     = document.getElementById('best');
  const sessionEl  = document.getElementById('session');
  const avgDownEl  = document.getElementById('avg-down');
  const avgHoldEl  = document.getElementById('avg-hold');
  const phaseText  = document.getElementById('phase-text');
  const dotD       = document.getElementById('dot-d');
  const dotH       = document.getElementById('dot-h');
  const dotU       = document.getElementById('dot-u');
  const cardDown   = document.getElementById('card-down');
  const cardHold   = document.getElementById('card-hold');
  const timerDownEl= document.getElementById('timer-down');
  const timerHoldEl= document.getElementById('timer-hold');
  const btnMain    = document.getElementById('btn-main');
  const btnLabel   = document.getElementById('btn-label');
  const btnHint    = document.getElementById('btn-hint');

  bestEl.textContent = best;

  // ── Ring ──────────────────────────────────────────
  function updateRing() {
    // r=65 → circumference ≈ 408
    ringEl.style.strokeDashoffset = 408 * (1 - (count % 10) / 10);
  }

  // ── Flash ─────────────────────────────────────────
  function flashScreen() {
    flashEl.classList.add('show');
    setTimeout(() => flashEl.classList.remove('show'), 120);
  }

  // ── Count +1 ──────────────────────────────────────
  function addCount(downSec, holdSec) {
    count++; session++;
    if (count > best) {
      best = count;
      localStorage.setItem('squat_best', best);
      bestEl.textContent = best;
    }
    countEl.textContent   = count;
    sessionEl.textContent = session;

    // 更新平均
    repCount++;
    totalDown += downSec;
    totalHold += holdSec;
    avgDownEl.textContent = (totalDown / repCount).toFixed(1);
    avgHoldEl.textContent = (totalHold / repCount).toFixed(1);

    updateRing();
    flashScreen();
    countEl.classList.remove('pop');
    void countEl.offsetWidth;
    countEl.classList.add('pop');
  }

  // ── Phase dots & text ─────────────────────────────
  function setPhaseUI(p) {
    dotD.className = 'phase-dot' + (p === 'descending' ? ' d' : '');
    dotH.className = 'phase-dot' + (p === 'holding'    ? ' h' : '');
    dotU.className = 'phase-dot' + (p === 'done'       ? ' u' : '');

    if      (p === 'descending') phaseText.textContent = '↓ 蹲下中，計時開始…';
    else if (p === 'holding')    phaseText.textContent = '⏸ 到底了，維持住！';
    else if (p === 'done')       phaseText.textContent = '✓ 完成！';
    else                         phaseText.textContent = '準備好後按下方按鍵';
  }

  // ── Button appearance ─────────────────────────────
  function setBtnState(s) {
    btnMain.className = 'btn-main state-' + s;
    if (s === 'idle') {
      btnLabel.textContent = '開始蹲下';
      btnHint.textContent  = '按下開始計時';
    } else if (s === 'down') {
      btnLabel.textContent = '起立完成';
      btnHint.textContent  = '蹲到底後自動切換維持';
    } else if (s === 'hold') {
      btnLabel.textContent = '手動完成';
      btnHint.textContent  = '起立時感應器會自動偵測';
    }
  }

  // ── RAF timer loop ────────────────────────────────
  function startRAF() {
    if (rafId) cancelAnimationFrame(rafId);
    function tick() {
      const now = performance.now();
      if (phase === 'descending') {
        timerDownEl.textContent = ((now - downStart) / 1000).toFixed(1);
      } else if (phase === 'holding') {
        timerHoldEl.textContent = ((now - holdStart) / 1000).toFixed(1);
      }
      rafId = requestAnimationFrame(tick);
    }
    rafId = requestAnimationFrame(tick);
  }
  function stopRAF() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  // ── Timer card styles ─────────────────────────────
  function setCardPhase(downClass, holdClass) {
    cardDown.className = 'timer-card ' + downClass;
    cardHold.className = 'timer-card ' + holdClass;
  }

  // ── 完成一下（感應器或按鍵共用）────────────────────
  function finishRep() {
    if (phase !== 'descending' && phase !== 'holding') return;
    stopRAF();
    const now     = performance.now();
    const downSec = ((holdStart > 0 ? holdStart : now) - downStart) / 1000;
    const holdSec = holdStart > 0 ? (now - holdStart) / 1000 : 0;

    timerDownEl.textContent = downSec.toFixed(1);
    timerHoldEl.textContent = holdSec.toFixed(1);
    addCount(downSec, holdSec);
    setCardPhase('done-down', 'done-hold');
    setPhaseUI('done');
    setBtnState('idle');
    phase     = 'idle';
    holdStart = 0;
    handleMotion._stillSince  = null;
    handleMotion._risingSince  = null;
  }

  // ── 感應器：靜止→holding，往上→完成 ──────────────
  function handleMotion(e) {
    const acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return;

    gravX = LP * gravX + (1 - LP) * acc.x;
    gravY = LP * gravY + (1 - LP) * acc.y;
    gravZ = LP * gravZ + (1 - LP) * acc.z;

    warmup++;
    if (warmup < WARMUP_FRAMES) return;
    if (warmup === WARMUP_FRAMES) {
      sensorReady = true;
      statusDot.className    = 'status-dot ready';
      statusText.textContent = '感應器就緒';
    }

    if (phase !== 'descending' && phase !== 'holding') return;

    const dynX   = acc.x - gravX;
    const dynY   = acc.y - gravY;
    const dynZ   = acc.z - gravZ;
    const dynMag = Math.sqrt(dynX*dynX + dynY*dynY + dynZ*dynZ);

    // 沿重力方向的動態分量（正 = 向上）
    const gMag  = Math.sqrt(gravX*gravX + gravY*gravY + gravZ*gravZ) || 9.8;
    const dynUp = -(dynX*gravX + dynY*gravY + dynZ*gravZ) / gMag;

    const now = performance.now();

    // ── holding 階段：偵測往上加速 → 自動完成 ──────
    if (phase === 'holding') {
      if (dynUp > RISE_THRESHOLD) {
        if (!handleMotion._risingSince) {
          handleMotion._risingSince = now;
        } else if (now - handleMotion._risingSince > 150) {
          // 確認是真的往上，不是雜訊
          finishRep();
          return;
        }
      } else {
        handleMotion._risingSince = null;
      }
      return; // holding 階段不做靜止判定
    }

    // ── descending 階段：靜止超過閾值 → 切換 holding ──
    if (dynMag < STILL_THRESHOLD) {
      if (!handleMotion._stillSince) {
        handleMotion._stillSince = now;
      } else if (
        now - handleMotion._stillSince > 500 &&
        now - downStart > MIN_DOWN_MS
      ) {
        holdStart = now;
        phase     = 'holding';
        handleMotion._stillSince = null;
        timerDownEl.textContent  = ((holdStart - downStart) / 1000).toFixed(1);
        setCardPhase('done-down', 'phase-hold');
        setPhaseUI('holding');
        setBtnState('hold');
      }
    } else {
      handleMotion._stillSince = null;
    }
  }
  handleMotion._stillSince  = null;
  handleMotion._risingSince = null;

  // ── 大按鍵：第一下開始，第二下手動備用 ───────────
  btnMain.addEventListener('click', () => {
    const now = performance.now();

    if (phase === 'idle') {
      // 第一下：開始蹲下計時
      phase     = 'descending';
      downStart = now;
      timerDownEl.textContent = '0.0';
      timerHoldEl.textContent = '0.0';
      setCardPhase('phase-down', '');
      setPhaseUI('descending');
      setBtnState('down');
      startRAF();

    } else if (phase === 'descending' || phase === 'holding') {
      // 手動備用：感應器沒抓到時按此完成
      finishRep();
    }
  });

  // ── 最短蹲下時間滑桿 ──────────────────────────────
  const minDownSlider = document.getElementById('min-down-slider');
  const minDownVal    = document.getElementById('min-down-val');
  minDownSlider.addEventListener('input', () => {
    MIN_DOWN_MS = parseFloat(minDownSlider.value) * 1000;
    minDownVal.textContent = parseFloat(minDownSlider.value).toFixed(1) + 's';
  });

  // ── 請求感應器 ────────────────────────────────────
  function startMotion() {
    if (typeof DeviceMotionEvent === 'undefined') {
      statusText.textContent = '不支援感應器，仍可手動使用';
      sensorReady = false; return;
    }
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission()
        .then(s => {
          if (s === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            statusText.textContent = '感應器校正中…';
          } else {
            statusText.textContent = '無感應器權限，手動使用';
          }
        }).catch(() => { statusText.textContent = '感應器啟動失敗'; });
    } else {
      window.addEventListener('devicemotion', handleMotion);
      statusText.textContent = '感應器校正中…';
    }
  }

  // iOS 需要使用者手勢
  (function init() {
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      document.addEventListener('click', function once() {
        document.removeEventListener('click', once);
        startMotion();
      }, { once: true });
    } else {
      startMotion();
    }
  })();

  // ── Reset ─────────────────────────────────────────
  document.getElementById('btn-reset').addEventListener('click', (e) => {
    e.stopPropagation();
    stopRAF();
    count = session = repCount = warmup = 0;
    totalDown = totalHold = 0;
    gravX = gravY = gravZ = 0;
    phase = 'idle'; holdStart = 0;
    handleMotion._stillSince  = null;
    handleMotion._risingSince = null;
    sensorReady = false;

    countEl.textContent    = '0';
    sessionEl.textContent  = '0';
    avgDownEl.textContent  = '-';
    avgHoldEl.textContent  = '-';
    timerDownEl.textContent = '0.0';
    timerHoldEl.textContent = '0.0';

    updateRing();
    setPhaseUI('idle');
    setBtnState('idle');
    setCardPhase('', '');

    statusDot.className    = 'status-dot';
    statusText.textContent = '感應器重新校正中…';
  });
</script>
</body>
</html>
