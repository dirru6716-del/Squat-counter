<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>深蹲計數器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --accent: #c8f542;
    --accent2: #42f5a4;
    --text: #f0f0f0;
    --muted: #555570;
    --danger: #ff4d6d;
    --glow: rgba(200, 245, 66, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 40px 24px 36px;
    overflow: hidden;
    position: relative;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(200,245,66,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,245,66,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* Radial glow behind counter */
  body::after {
    content: '';
    position: fixed;
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    height: 320px;
    background: radial-gradient(circle, rgba(200,245,66,0.12) 0%, transparent 70%);
    pointer-events: none;
    transition: opacity 0.3s;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    z-index: 1;
  }
  .header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(28px, 8vw, 38px);
    letter-spacing: 6px;
    color: var(--accent);
    text-shadow: 0 0 20px var(--glow);
  }
  .header p {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* ── Main counter area ── */
  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 1;
  }

  /* Circular ring */
  .ring-wrap {
    position: relative;
    width: 220px;
    height: 220px;
  }
  .ring-svg {
    position: absolute;
    inset: 0;
    transform: rotate(-90deg);
  }
  .ring-bg {
    fill: none;
    stroke: var(--surface);
    stroke-width: 6;
  }
  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 628;
    stroke-dashoffset: 628;
    transition: stroke-dashoffset 0.5s cubic-bezier(.4,0,.2,1);
    filter: drop-shadow(0 0 6px var(--accent));
  }

  .ring-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .count-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 96px;
    line-height: 1;
    color: var(--text);
    letter-spacing: -2px;
    transition: transform 0.15s cubic-bezier(.4,0,.2,1);
    text-shadow: 0 0 30px rgba(200,245,66,0.3);
  }
  .count-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Pulse animation on count */
  @keyframes pulse-count {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .count-display.pop {
    animation: pulse-count 0.35s ease;
  }

  /* ── Phase indicator ── */
  .phase-bar {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .phase-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.2s, box-shadow 0.2s;
  }
  .phase-dot.active {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .phase-text {
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    min-width: 80px;
    text-align: center;
  }

  /* ── Status bar ── */
  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid #222235;
    border-radius: 20px;
    padding: 8px 18px;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .status-dot.ready {
    background: var(--accent2);
    box-shadow: 0 0 8px var(--accent2);
    animation: blink 1.6s ease-in-out infinite;
  }
  .status-dot.error {
    background: var(--danger);
    box-shadow: 0 0 8px var(--danger);
  }
  @keyframes blink {
    0%,100% { opacity:1; }
    50%      { opacity:0.4; }
  }
  .status-text {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ── Stats row ── */
  .stats {
    display: flex;
    gap: 24px;
    z-index: 1;
  }
  .stat-box {
    background: var(--surface);
    border: 1px solid #222235;
    border-radius: 12px;
    padding: 12px 20px;
    text-align: center;
    min-width: 80px;
  }
  .stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--accent);
    letter-spacing: 1px;
    text-shadow: 0 0 10px var(--glow);
  }
  .stat-lbl {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── Reset button ── */
  .btn-reset {
    z-index: 1;
    background: transparent;
    border: 1.5px solid #333350;
    color: var(--muted);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 14px 48px;
    border-radius: 40px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, box-shadow 0.2s, background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-reset:active,
  .btn-reset:hover {
    border-color: var(--danger);
    color: var(--danger);
    background: rgba(255,77,109,0.06);
    box-shadow: 0 0 16px rgba(255,77,109,0.2);
  }

  /* Flash overlay on squat count */
  .flash {
    position: fixed;
    inset: 0;
    background: rgba(200,245,66,0.07);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.08s;
    z-index: 99;
  }
  .flash.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>深蹲計數器</h1>
  <p>Squat Counter · Gyroscope</p>
</div>

<div class="main">
  <div class="ring-wrap">
    <svg class="ring-svg" viewBox="0 0 220 220">
      <circle class="ring-bg" cx="110" cy="110" r="100"/>
      <circle class="ring-progress" id="ring" cx="110" cy="110" r="100"/>
    </svg>
    <div class="ring-inner">
      <div class="count-display" id="count">0</div>
      <div class="count-label">次</div>
    </div>
  </div>

  <div class="phase-bar">
    <div class="phase-dot" id="dot-down"></div>
    <div class="phase-text" id="phase-text">等待動作</div>
    <div class="phase-dot" id="dot-up"></div>
  </div>

  <div class="status-row">
    <div class="status-dot" id="status-dot"></div>
    <div class="status-text" id="status-text">請允許感應器存取</div>
  </div>
</div>

<div class="stats">
  <div class="stat-box">
    <div class="stat-val" id="best">0</div>
    <div class="stat-lbl">最高紀錄</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="session">0</div>
    <div class="stat-lbl">本次組數</div>
  </div>
</div>

<button class="btn-reset" id="btn-reset">歸　零</button>

<div class="flash" id="flash"></div>

<script>
  // ── State ──────────────────────────────────────────────
  let count = 0;
  let best  = parseInt(localStorage.getItem('squat_best') || '0');
  let session = 0;

  // Squat detection state machine
  // phase: 'idle' → 'down' → 'up' → (count++) → 'idle'
  const THRESHOLD_DOWN = 12;   // deg, beta tilt to detect squat down
  const THRESHOLD_UP   = 4;    // deg, back to near-upright
  const COOLDOWN_MS    = 600;  // ms between counts

  let phase = 'idle'; // 'idle' | 'down' | 'up'
  let lastCountTime = 0;

  // ── DOM refs ──────────────────────────────────────────
  const countEl    = document.getElementById('count');
  const ringEl     = document.getElementById('ring');
  const phaseText  = document.getElementById('phase-text');
  const dotDown    = document.getElementById('dot-down');
  const dotUp      = document.getElementById('dot-up');
  const statusDot  = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const bestEl     = document.getElementById('best');
  const sessionEl  = document.getElementById('session');
  const flashEl    = document.getElementById('flash');

  // ── Init display ──────────────────────────────────────
  bestEl.textContent = best;

  // ── Ring progress (resets every 10) ───────────────────
  function updateRing() {
    const pct = (count % 10) / 10;
    const circumference = 628;
    ringEl.style.strokeDashoffset = circumference * (1 - pct);
  }

  // ── Flash ─────────────────────────────────────────────
  function flashScreen() {
    flashEl.classList.add('show');
    setTimeout(() => flashEl.classList.remove('show'), 120);
  }

  // ── Count up ──────────────────────────────────────────
  function addCount() {
    const now = Date.now();
    if (now - lastCountTime < COOLDOWN_MS) return;
    lastCountTime = now;

    count++;
    session++;
    if (count > best) {
      best = count;
      localStorage.setItem('squat_best', best);
      bestEl.textContent = best;
    }

    countEl.textContent = count;
    sessionEl.textContent = session;
    updateRing();
    flashScreen();

    countEl.classList.remove('pop');
    void countEl.offsetWidth; // reflow
    countEl.classList.add('pop');
  }

  // ── Phase UI ──────────────────────────────────────────
  function setPhaseUI(p) {
    dotDown.classList.toggle('active', p === 'down');
    dotUp.classList.toggle('active',   p === 'up');
    if      (p === 'down') phaseText.textContent = '↓ 蹲下';
    else if (p === 'up')   phaseText.textContent = '↑ 起立';
    else                   phaseText.textContent = '等待動作';
  }

  // ── Gyroscope handler ─────────────────────────────────
  // beta  = front-back tilt (-180~180). When you squat, phone tilts forward → beta increases.
  // We use absolute beta change from standing baseline.
  let baseline = null;
  let baselineSet = false;
  let betaSamples = [];
  const CALIBRATE_FRAMES = 30;

  function handleOrientation(e) {
    // Gracefully handle null values
    if (e.beta === null) return;

    const beta = e.beta;

    // Calibrate: collect first N samples to set standing baseline
    if (!baselineSet) {
      betaSamples.push(beta);
      if (betaSamples.length >= CALIBRATE_FRAMES) {
        baseline = betaSamples.reduce((a,b) => a+b, 0) / betaSamples.length;
        baselineSet = true;
        statusDot.className = 'status-dot ready';
        statusText.textContent = '偵測中 · 開始深蹲';
        setPhaseUI('idle');
      }
      return;
    }

    const delta = Math.abs(beta - baseline);

    // State machine
    if (phase === 'idle' && delta > THRESHOLD_DOWN) {
      phase = 'down';
      setPhaseUI('down');
    } else if (phase === 'down' && delta < THRESHOLD_UP) {
      phase = 'up';
      setPhaseUI('up');
      addCount();
      // short pause then back to idle
      setTimeout(() => {
        phase = 'idle';
        setPhaseUI('idle');
      }, COOLDOWN_MS);
    }
  }

  // ── Request permission (iOS 13+) ──────────────────────
  function startGyro() {
    if (typeof DeviceOrientationEvent === 'undefined') {
      statusDot.className = 'status-dot error';
      statusText.textContent = '不支援陀螺儀';
      return;
    }

    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      // iOS 13+ requires user gesture
      DeviceOrientationEvent.requestPermission()
        .then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            statusText.textContent = '校正中，請站直…';
          } else {
            statusDot.className = 'status-dot error';
            statusText.textContent = '未獲得感應器權限';
          }
        })
        .catch(() => {
          statusDot.className = 'status-dot error';
          statusText.textContent = '權限請求失敗';
        });
    } else {
      // Android / non-iOS
      window.addEventListener('deviceorientation', handleOrientation);
      statusText.textContent = '校正中，請站直…';
    }
  }

  // iOS requires requestPermission on user gesture
  // We start automatically; on iOS it'll prompt via the first touch/interaction.
  // Actually try on load, fall back to tap-to-start.
  (function init() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      // iOS: need gesture
      statusText.textContent = '點擊畫面開始';
      document.addEventListener('click', function once() {
        document.removeEventListener('click', once);
        startGyro();
      }, { once: true });
    } else {
      startGyro();
    }
  })();

  // ── Reset ─────────────────────────────────────────────
  document.getElementById('btn-reset').addEventListener('click', (e) => {
    e.stopPropagation(); // don't trigger gyro start click
    count = 0;
    session = 0;
    phase = 'idle';
    baseline = null;
    baselineSet = false;
    betaSamples = [];

    countEl.textContent = '0';
    sessionEl.textContent = '0';
    updateRing();
    setPhaseUI('idle');

    if (statusDot.classList.contains('ready')) {
      statusText.textContent = '校正中，請站直…';
      statusDot.className = 'status-dot';
    }
  });
</script>
</body>
</html>
