<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>深蹲計數器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --accent: #c8f542;
    --accent2: #42f5a4;
    --text: #f0f0f0;
    --muted: #555570;
    --danger: #ff4d6d;
    --glow: rgba(200, 245, 66, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 40px 24px 36px;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(200,245,66,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,245,66,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    height: 320px;
    background: radial-gradient(circle, rgba(200,245,66,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .header {
    text-align: center;
    z-index: 1;
  }
  .header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(28px, 8vw, 38px);
    letter-spacing: 6px;
    color: var(--accent);
    text-shadow: 0 0 20px var(--glow);
  }
  .header p {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-top: 4px;
    text-transform: uppercase;
  }

  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 1;
  }

  .ring-wrap {
    position: relative;
    width: 220px;
    height: 220px;
  }
  .ring-svg {
    position: absolute;
    inset: 0;
    transform: rotate(-90deg);
  }
  .ring-bg {
    fill: none;
    stroke: var(--surface);
    stroke-width: 6;
  }
  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 628;
    stroke-dashoffset: 628;
    transition: stroke-dashoffset 0.5s cubic-bezier(.4,0,.2,1);
    filter: drop-shadow(0 0 6px var(--accent));
  }
  .ring-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .count-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 96px;
    line-height: 1;
    color: var(--text);
    letter-spacing: -2px;
    text-shadow: 0 0 30px rgba(200,245,66,0.3);
  }
  .count-label {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
  }

  @keyframes pulse-count {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .count-display.pop {
    animation: pulse-count 0.35s ease;
  }

  /* 加速度視覺化 bar */
  .accel-bar-wrap {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
  }
  .accel-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    writing-mode: vertical-rl;
    text-orientation: mixed;
  }
  .accel-track {
    width: 14px;
    height: 120px;
    background: var(--surface);
    border-radius: 7px;
    overflow: hidden;
    position: relative;
    border: 1px solid #222235;
  }
  /* 中線（水平） */
  .accel-track::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 1px;
    background: #333350;
  }
  /* 上方標籤 ↑ */
  .accel-track::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
  }
  .accel-fill {
    position: absolute;
    left: 0;
    width: 100%;
    height: 0%;
    border-radius: 7px;
    transition: height 0.04s, top 0.04s, background 0.1s;
  }
  .accel-arrows {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    height: 120px;
    font-size: 10px;
    color: var(--muted);
    gap: 0;
  }

  .phase-bar {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .phase-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.2s, box-shadow 0.2s;
  }
  .phase-dot.active {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  .phase-text {
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    min-width: 80px;
    text-align: center;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid #222235;
    border-radius: 20px;
    padding: 8px 18px;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .status-dot.ready {
    background: var(--accent2);
    box-shadow: 0 0 8px var(--accent2);
    animation: blink 1.6s ease-in-out infinite;
  }
  .status-dot.error {
    background: var(--danger);
    box-shadow: 0 0 8px var(--danger);
  }
  @keyframes blink {
    0%,100% { opacity:1; }
    50%      { opacity:0.4; }
  }
  .status-text {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .stats {
    display: flex;
    gap: 24px;
    z-index: 1;
  }
  .stat-box {
    background: var(--surface);
    border: 1px solid #222235;
    border-radius: 12px;
    padding: 12px 20px;
    text-align: center;
    min-width: 80px;
  }
  .stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--accent);
    letter-spacing: 1px;
    text-shadow: 0 0 10px var(--glow);
  }
  .stat-lbl {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 2px;
  }

  .btn-reset {
    z-index: 1;
    background: transparent;
    border: 1.5px solid #333350;
    color: var(--muted);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 14px 48px;
    border-radius: 40px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, box-shadow 0.2s, background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-reset:active,
  .btn-reset:hover {
    border-color: var(--danger);
    color: var(--danger);
    background: rgba(255,77,109,0.06);
    box-shadow: 0 0 16px rgba(255,77,109,0.2);
  }

  .flash {
    position: fixed;
    inset: 0;
    background: rgba(200,245,66,0.07);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.08s;
    z-index: 99;
  }
  .flash.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>深蹲計數器</h1>
  <p>Squat Counter · Accelerometer</p>
</div>

<div class="main">
  <div class="ring-wrap">
    <svg class="ring-svg" viewBox="0 0 220 220">
      <circle class="ring-bg" cx="110" cy="110" r="100"/>
      <circle class="ring-progress" id="ring" cx="110" cy="110" r="100"/>
    </svg>
    <div class="ring-inner">
      <div class="count-display" id="count">0</div>
      <div class="count-label">次</div>
    </div>
  </div>

  <!-- 加速度視覺化（垂直） -->
  <div class="accel-bar-wrap">
    <div class="accel-arrows">
      <span style="color:var(--accent)">↑</span>
      <span style="color:var(--danger)">↓</span>
    </div>
    <div class="accel-track">
      <div class="accel-fill" id="accel-fill"></div>
    </div>
    <div class="accel-label">加速度</div>
  </div>

  <div class="phase-bar">
    <div class="phase-dot" id="dot-down"></div>
    <div class="phase-text" id="phase-text">等待動作</div>
    <div class="phase-dot" id="dot-up"></div>
  </div>

  <div class="status-row">
    <div class="status-dot" id="status-dot"></div>
    <div class="status-text" id="status-text">請允許感應器存取</div>
  </div>
</div>

<div class="stats">
  <div class="stat-box">
    <div class="stat-val" id="best">0</div>
    <div class="stat-lbl">最高紀錄</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="session">0</div>
    <div class="stat-lbl">本次組數</div>
  </div>
</div>

<button class="btn-reset" id="btn-reset">歸　零</button>

<div class="flash" id="flash"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let count   = 0;
  let best    = parseInt(localStorage.getItem('squat_best') || '0');
  let session = 0;

  // ── 偵測原理 ────────────────────────────────────────────────────────────────
  //
  //  使用 DeviceMotion 的 accelerationIncludingGravity（含重力加速度）
  //  用低通濾波器 (Low-pass filter) 分離出「重力向量」
  //  動態加速度 = 原始 - 重力
  //
  //  深蹲特徵（手機任意放置皆適用）：
  //    起立中段：身體快速上升 → 沿重力方向出現明顯向上動態加速度（正峰值）
  //    起立完成：靜止 → 動態加速度歸零
  //
  //  狀態機：
  //    idle → (起立加速超過閾值) → rising → (回到靜止) → 計數+1 → idle
  //
  //  這樣設計的好處：
  //    ✅ 手機放口袋、腰帶、手持都可以
  //    ✅ 放桌上不會誤觸（沒有起立動作就不會觸發 rising）
  //    ✅ 不依賴手機角度

  const LP = 0.85;              // 低通濾波係數
  const RISE_THRESHOLD  = 4.0;  // m/s² 起立動態加速度閾值
  const STILL_THRESHOLD = 1.5;  // m/s² 靜止判定閾值
  const COOLDOWN_MS     = 1000; // 計數後冷卻 ms

  let gravX = 0, gravY = 0, gravZ = 0;
  let phase   = 'idle';   // 'idle' | 'rising'
  let locked  = false;
  let warmup  = 0;
  const WARMUP_FRAMES = 25;

  // ── DOM ────────────────────────────────────────────────────────────────────
  const countEl    = document.getElementById('count');
  const ringEl     = document.getElementById('ring');
  const phaseText  = document.getElementById('phase-text');
  const dotDown    = document.getElementById('dot-down');
  const dotUp      = document.getElementById('dot-up');
  const statusDot  = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const bestEl     = document.getElementById('best');
  const sessionEl  = document.getElementById('session');
  const flashEl    = document.getElementById('flash');
  const accelFill  = document.getElementById('accel-fill');

  bestEl.textContent = best;

  // ── Ring ───────────────────────────────────────────────────────────────────
  function updateRing() {
    ringEl.style.strokeDashoffset = 628 * (1 - (count % 10) / 10);
  }

  // ── Flash ──────────────────────────────────────────────────────────────────
  function flashScreen() {
    flashEl.classList.add('show');
    setTimeout(() => flashEl.classList.remove('show'), 120);
  }

  // ── Count ──────────────────────────────────────────────────────────────────
  function addCount() {
    count++; session++;
    if (count > best) {
      best = count;
      localStorage.setItem('squat_best', best);
      bestEl.textContent = best;
    }
    countEl.textContent  = count;
    sessionEl.textContent = session;
    updateRing();
    flashScreen();
    countEl.classList.remove('pop');
    void countEl.offsetWidth;
    countEl.classList.add('pop');
  }

  // ── Phase UI ───────────────────────────────────────────────────────────────
  function setPhaseUI(p) {
    dotDown.classList.toggle('active', p === 'rising');
    dotUp.classList.toggle('active',   p === 'done');
    if      (p === 'rising') phaseText.textContent = '↑ 起立中';
    else if (p === 'done')   phaseText.textContent = '✓ 完成';
    else                     phaseText.textContent = '等待動作';
  }

  // ── 加速度視覺化（垂直）────────────────────────────────────────────────────
  function updateAccelBar(val) {
    // val 正=向上(起立)，負=向下(蹲下)
    // track 高度 120px，中點 = 50%
    // 向上 → fill 從中點往上長（top 往上移）
    // 向下 → fill 從中點往下長（top = 50%）
    const pct = Math.min(Math.abs(val) / 12, 1) * 50; // 最多佔50%高度
    if (val >= 0) {
      // 向上：fill 從 (50-pct)% 開始，高度 pct%
      accelFill.style.top        = (50 - pct) + '%';
      accelFill.style.height     = pct + '%';
      accelFill.style.background = 'var(--accent)';
    } else {
      // 向下：fill 從 50% 開始，往下延伸 pct%
      accelFill.style.top        = '50%';
      accelFill.style.height     = pct + '%';
      accelFill.style.background = 'var(--danger)';
    }
  }

  // ── DeviceMotion 主邏輯 ─────────────────────────────────────────────────────
  function handleMotion(e) {
    const acc = e.accelerationIncludingGravity;
    if (!acc || acc.x === null) return;

    // 低通濾波估計重力
    gravX = LP * gravX + (1 - LP) * acc.x;
    gravY = LP * gravY + (1 - LP) * acc.y;
    gravZ = LP * gravZ + (1 - LP) * acc.z;

    // 暖機
    warmup++;
    if (warmup <= WARMUP_FRAMES) {
      if (warmup < WARMUP_FRAMES) {
        statusText.textContent = `校正中 ${warmup}/${WARMUP_FRAMES}`;
      } else {
        statusDot.className    = 'status-dot ready';
        statusText.textContent = '偵測中 · 開始深蹲';
      }
      if (warmup < WARMUP_FRAMES) return;
    }

    // 動態加速度
    const dynX = acc.x - gravX;
    const dynY = acc.y - gravY;
    const dynZ = acc.z - gravZ;

    // 沿重力方向的分量（正 = 向上，即對抗重力方向）
    const gMag = Math.sqrt(gravX*gravX + gravY*gravY + gravZ*gravZ) || 9.8;
    const dynUp = -(dynX*gravX + dynY*gravY + dynZ*gravZ) / gMag;

    updateAccelBar(dynUp);

    if (locked) return;

    // 狀態機
    if (phase === 'idle' && dynUp > RISE_THRESHOLD) {
      // 偵測到起立加速
      phase = 'rising';
      setPhaseUI('rising');
    } else if (phase === 'rising' && Math.abs(dynUp) < STILL_THRESHOLD) {
      // 加速度消退，起立完成
      phase = 'idle';
      addCount();
      setPhaseUI('done');
      locked = true;
      setTimeout(() => {
        locked = false;
        setPhaseUI('idle');
      }, COOLDOWN_MS);
    }
  }

  // ── 請求感應器權限 ──────────────────────────────────────────────────────────
  function startMotion() {
    if (typeof DeviceMotionEvent === 'undefined') {
      statusDot.className    = 'status-dot error';
      statusText.textContent = '不支援加速度計';
      return;
    }
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      // iOS 13+
      DeviceMotionEvent.requestPermission()
        .then(state => {
          if (state === 'granted') {
            window.addEventListener('devicemotion', handleMotion);
            statusText.textContent = '校正中，請靜止…';
          } else {
            statusDot.className    = 'status-dot error';
            statusText.textContent = '未獲得感應器權限';
          }
        })
        .catch(() => {
          statusDot.className    = 'status-dot error';
          statusText.textContent = '權限請求失敗';
        });
    } else {
      window.addEventListener('devicemotion', handleMotion);
      statusText.textContent = '校正中，請靜止…';
    }
  }

  (function init() {
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      statusText.textContent = '點擊畫面開始';
      document.addEventListener('click', function once() {
        document.removeEventListener('click', once);
        startMotion();
      }, { once: true });
    } else {
      startMotion();
    }
  })();

  // ── Reset ───────────────────────────────────────────────────────────────────
  document.getElementById('btn-reset').addEventListener('click', (e) => {
    e.stopPropagation();
    count = session = warmup = 0;
    gravX = gravY = gravZ = 0;
    phase  = 'idle';
    locked = false;

    countEl.textContent   = '0';
    sessionEl.textContent = '0';
    updateRing();
    setPhaseUI('idle');
    updateAccelBar(0);

    if (statusDot.classList.contains('ready')) {
      statusDot.className    = 'status-dot';
      statusText.textContent = '校正中，請靜止…';
    }
  });
</script>
</body>
</html>
